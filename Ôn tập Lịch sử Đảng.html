}

/* ---------- QUIZ ---------- */
let Z={ch:{1:1,2:1,3:1},mode:'practice',n:20,src:'all',t:60},Q=null,tmr=null;
const src={all:'Tất cả câu',wrong:'Câu làm sai',new:'Câu chưa làm',bm:'Câu đã đánh dấu ⭐'};
function pool(){return ALLQ.filter(q=>Z.ch[q.ch]&&(Z.src==='all'||(Z.src==='wrong'&&S.st[q.id]&&!S.st[q.id].last)||(Z.src==='new'&&!S.st[q.id])||(Z.src==='bm'&&S.bm[q.id])))}
function essayPool(){const n=Object.values(Z.ch).filter(Boolean).length;const l=D.essay.filter(e=>{const g=grp(e);return g==='x'?n>=2:Z.ch[g]});return l.length?l:D.essay}
function setup(){const p=pool().length,ex=Z.mode=='exam';
  return `<div class="card"><h2>Cài đặt bài làm</h2><p><b>Chương</b></p><div class="pills">${CH.map(c=>`<button class="pill ${Z.ch[c.id]?'on':''}" data-a="zch" data-v="${c.id}">${c.title}</button>`).join('')}</div>
  <p><b>Nguồn câu hỏi</b></p><div class="pills">${Object.entries(src).map(([k,v])=>`<button class="pill ${Z.src==k?'on':''}" data-a="zsrc" data-v="${k}">${v}</button>`).join('')}</div>
  <p><b>Chế độ</b></p><div class="pills"><button class="pill ${Z.mode=='practice'?'on':''}" data-a="zmode" data-v="practice">Luyện tập (xem đáp án ngay)</button><button class="pill ${ex?'on':''}" data-a="zmode" data-v="exam">Thi thử: 40 trắc nghiệm + 1 tự luận</button></div>
  ${ex?`<p><b>Thời gian làm bài</b></p><div class="pills">${[45,60,90].map(n=>`<button class="pill ${Z.t==n?'on':''}" data-a="zt" data-v="${n}">${n} phút</button>`).join('')}</div>`:`<p><b>Số câu</b></p><div class="pills">${[10,20,30,0].map(n=>`<button class="pill ${Z.n==n?'on':''}" data-a="zn" data-v="${n}">${n||'Tất cả'}</button>`).join('')}</div>`}
  <p class="mu">Có <b>${p}</b> câu trắc nghiệm phù hợp bộ lọc.${ex?` Đề thi thử gồm <b>${Math.min(40,p)}</b> câu trắc nghiệm ngẫu nhiên + <b>1 câu tự luận</b> ngẫu nhiên (chấm cuối bài, phần tự luận bạn tự đối chiếu dàn ý).`:' Đáp án được xáo trộn mỗi lần làm.'}</p><button class="btn p" data-a="zstart" ${p?'':'disabled'}>Bắt đầu ▶</button></div>`}
const tmFmt=l=>{l=Math.max(0,l);return Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0')};
const egText=()=>`Tự chấm: ${Q.eg.filter(Boolean).length}/${Q.essay.out.length} ý`;
function startQuiz(list,redo){
  clearInterval(tmr);list=shuf(list);const ex=Z.mode==='exam'&&!redo;
  if(ex)list=list.slice(0,40);else if(!redo&&Z.n&&Z.n<list.length)list=list.slice(0,Z.n);
  const ep=ex?essayPool():[];
  Q={list:list.map(q=>({q,o:shuf([...q.o.keys()])})),i:0,ans:list.map(()=>null),mode:Z.mode,done:false,t0:Date.now(),essay:ep.length?ep[Math.random()*ep.length|0]:null,eans:'',eg:[]};
  Q.end=Date.now()+(redo?list.length:Z.t)*60000;
  if(Q.mode==='exam')tmr=setInterval(()=>{const l=Q.end-Date.now();if(l<=0){finish()}else{const e=$('#tm');if(e)e.textContent=tmFmt(l)}},1000);
  go('quiz')}
function rec(q,ok){const s=S.st[q.id]||(S.st[q.id]={r:0,w:0});ok?s.r++:s.w++;s.last=ok}
function finish(){if(!Q||Q.done)return;clearInterval(tmr);Q.done=true;Q.dur=Date.now()-Q.t0;if(Q.mode==='exam')Q.list.forEach((x,i)=>rec(x.q,Q.ans[i]===x.q.a));save();if(S.tab==='quiz')render()}
function quiz(){
  if(!Q)return setup();
  if(Q.done)return result();
  const n=Q.list.length,T=n+(Q.essay?1:0),pr=Q.mode==='practice',isE=Q.essay&&Q.i===n,x=Q.list[Q.i],q=x&&x.q,a=Q.ans[Q.i],lock=pr&&a!==null;
  const grid=Q.mode==='exam'?`<div class="qg">${Q.ans.map((v,i)=>`<button class="${v!==null?'a':''} ${i==Q.i?'c':''}" data-a="qjump" data-v="${i}">${i+1}</button>`).join('')}${Q.essay?`<button style="width:auto;padding:0 8px" class="${Q.eans.trim()?'a':''} ${isE?'c':''}" data-a="qjump" data-v="${n}">TL</button>`:''}</div>`:'';
  const top=`<div class="row"><span class="mu">${isE?'Câu tự luận':`Câu ${Q.i+1}/${n} · Chương ${q.ch}`}</span><span class="sp"></span>${Q.mode==='exam'?`<b>⏱ <span id="tm">${tmFmt(Q.end-Date.now())}</span></b>`:''}${isE?'':`<button class="btn s" data-a="bm" data-k="${q.id}">${S.bm[q.id]?'⭐ Đã lưu':'☆ Đánh dấu'}</button>`}${Q.mode==='exam'?'<button class="btn s p" data-a="qsub">Nộp bài</button>':''}<button class="btn s" data-a="qquit">Thoát</button></div>${bar((Q.i+(lock?1:0))/T*100)}${grid}`;
  let body;
  if(isE)body=`<div class="card"><h3>Câu tự luận (câu ${n+1}/${T})</h3><p><b>${esc(Q.essay.q)}</b></p><textarea id="eta" style="min-height:240px" placeholder="Viết bài làm của bạn: mở bài – các luận điểm có mốc thời gian – kết luận…">${esc(Q.eans)}</textarea><p class="mu">Dàn ý gợi ý chỉ hiện sau khi nộp bài để bạn tự đối chiếu.</p></div>`;
  else{const opts=x.o.map((oi,k)=>{let c='';if(lock)c=oi===q.a?'right':oi===a?'wrong':'';else if(a===oi)c='sel';return `<button class="opt ${c}" data-a="pick" data-v="${oi}"><i>${'ABCD'[k]}.</i><span>${esc(q.o[oi])}</span></button>`}).join('');
    body=`<div class="card"><h3>${md(q.q)}</h3>${opts}${lock?`<div class="exp">${a===q.a?'✅ <b>Chính xác!</b>':'❌ <b>Chưa đúng.</b>'} ${md(q.e||'')}</div>`:''}</div>`}
  return top+body+`<div class="row"><button class="btn" data-a="qprev" ${Q.i?'':'disabled'}>← Trước</button><span class="sp"></span>${Q.i<T-1?`<button class="btn p" data-a="qnext" ${pr&&!lock?'disabled':''}>${Q.i==n-1&&Q.essay?'Sang câu tự luận →':'Câu tiếp →'}</button>`:`<button class="btn p" data-a="${pr?'qfin':'qsub'}" ${pr&&!lock?'disabled':''}>Nộp bài ✓</button>`}</div>`}
function result(){
  const n=Q.list.length,ok=Q.list.filter((x,i)=>Q.ans[i]===x.q.a).length,bad=Q.list.map((x,i)=>[x,i]).filter(([x,i])=>Q.ans[i]!==x.q.a);
  const m=Math.floor(Q.dur/60000),s=Math.floor(Q.dur/1000)%60;
  const es=Q.essay?`<div class="card"><h3>✍️ Câu tự luận</h3><p><b>${esc(Q.essay.q)}</b></p><p class="mu">Bài làm của bạn:</p><div class="exp" style="white-space:pre-wrap;text-align:left">${Q.eans.trim()?esc(Q.eans):'(bỏ trống)'}</div><p class="mu" style="margin-top:12px">Đối chiếu dàn ý gợi ý, tích các ý bạn đã nêu để tự chấm:</p>${Q.essay.out.map((o,i)=>`<label class="ck"><input type="checkbox" data-a="ecg" data-k="${i}" ${Q.eg[i]?'checked':''}><span>${md(o)}</span></label>`).join('')}<p><b id="egs">${egText()}</b></p></div>`:'';
  return `<div class="card"><div class="big">${ok}/${n}</div><p style="text-align:center">phần trắc nghiệm · ${Math.round(ok/n*100)}% đúng · thang 10: <b>${(ok/n*10).toFixed(1)}</b> · thời gian ${m}p${s}s<br>${ok/n>=.8?'Rất tốt! 🎉':ok/n>=.5?'Khá ổn, ôn thêm các câu sai nhé.':'Cần ôn lại nhiều hơn, đọc phần Học trước nhé.'}${Q.essay?'<br>Phần tự luận: tự chấm ở bên dưới.':''}</p>
  <div class="row" style="justify-content:center"><button class="btn p" data-a="qredo" ${bad.length?'':'disabled'}>Làm lại ${bad.length} câu sai</button><button class="btn" data-a="qquit">Đề mới</button></div></div>${es}
  ${bad.length?`<h3>Các câu trắc nghiệm cần xem lại</h3>`:''}${bad.map(([x,i])=>`<div class="card"><p><b>Câu ${i+1}.</b> ${md(x.q.q)}</p><p style="color:var(--no)">Bạn chọn: ${Q.ans[i]===null?'(bỏ trống)':esc(x.q.o[Q.ans[i]])}</p><p style="color:var(--ok)">Đáp án đúng: ${esc(x.q.o[x.q.a])}</p><div class="exp">${md(x.q.e||'')}</div></div>`).join('')}`}

/* ---------- ESSAY ---------- */
let eF='0',eHigh=false,eHide=false;
const grp=e=>e.part.includes('PHẦN IV')?'x':(e.part.match(/CHƯƠNG (\d)/)||[])[1];

(()=>{

  let shown=false;
  const apply=()=>{
    const ov=mk('upd-ov','<div class="upd-ring"><div class="upd-ico">🚀</div></div><div class="upd-tx">Đang cập nhật…</div><div class="upd-sub">Tiến độ học của bạn được giữ nguyên</div><div class="upd-bar"><i></i></div>');
    requestAnimationFrame(()=>ov.classList.add('on'));
    setTimeout(()=>location.reload(),2000)};
  const offer=()=>{
    if(shown)return;shown=true;
    const busy=Q&&!Q.done,tt=mk('upd-toast','<span>🆕 Có bản cập nhật mới</span><button>Cập nhật</button>');
    setTimeout(()=>tt.classList.add('on'),50);
    tt.querySelector('button').onclick=()=>{tt.remove();apply()};
    if(!busy)setTimeout(()=>{if(tt.isConnected){tt.remove();apply()}},6000)}; // đang làm bài thì chỉ nhắc, không tự tải lại
  const check=async()=>{
    if(shown||document.hidden)return;
    try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!r.ok)return;
      const m=(await r.text()).match(/<meta name="build" content="([^"]*)"/);
      if(m&&m[1]!==cur)offer()}catch(e){}};
  setInterval(check,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  addEventListener('online',check);
  window.__checkUpdate=check;
})();


/* ---------- ONLINE PRESENCE (Supabase Realtime) ----------
   Điền 2 giá trị bên dưới (Project URL + anon public key). Để trống = tắt tính năng, không hiện gì. */
const PRESENCE={url:'https://qkxmifohzmcvtgkvtybg.supabase.co',key:'sb_publishable_wotB5PqvLRulx2BMWTkZ1Q_r12x7lwt'};
(()=>{
  const el=document.getElementById('online');if(!el||!PRESENCE.url||!PRESENCE.key)return;
  const num=el.querySelector('b');
  const show=n=>{if(String(n)!==num.textContent){num.textContent=n;num.classList.add('bump');setTimeout(()=>num.classList.remove('bump'),250)}el.hidden=false};
  const start=()=>{
    let ch;
    try{
      const sb=window.supabase.createClient(PRESENCE.url,PRESENCE.key,{realtime:{params:{eventsPerSecond:5}}});
      const id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
      ch=sb.channel('lsd-online',{config:{presence:{key:id}}});
      ch.on('presence',{event:'sync'},()=>show(Math.max(1,Object.keys(ch.presenceState()).length)));
      ch.subscribe(st=>{if(st==='SUBSCRIBED'&&!document.hidden)ch.track({at:Date.now()});
        if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')el.hidden=true});
      // chỉ tính người đang thật sự xem: ẩn tab thì bỏ đếm, quay lại thì đếm lại
      document.addEventListener('visibilitychange',()=>{try{document.hidden?ch.untrack():ch.track({at:Date.now()})}catch(e){}});
    }catch(e){el.hidden=true}
  };
  if(window.supabase)start();
  else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=start;s.onerror=()=>{el.hidden=true};document.head.appendChild(s)}
})();

/* ---------- SPLASH ---------- */
(()=>{const s=document.getElementById('splash');if(!s)return;const t0=performance.now();let done=false;
  const hide=()=>{if(done)return;done=true;s.classList.add('out');setTimeout(()=>s.remove(),700)};
  const go=()=>setTimeout(hide,Math.max(0,1700-(performance.now()-t0)));
  document.readyState==='complete'?go():addEventListener('load',go);
  setTimeout(hide,5000)})();
</script>
