iến bộ, công bằng xã hội và phát triển bền vững.","Ý nghĩa: tạo khuôn khổ định hướng cho việc phát triển và hoàn thiện thể chế kinh tế."],"sample":"Kinh tế thị trường định hướng xã hội chủ nghĩa là mô hình kinh tế tổng quát của thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, được xác định rõ tại Đại hội IX (2001). Đó là nền kinh tế vận hành theo các quy luật của thị trường, phát huy vai trò của nhiều thành phần kinh tế, đồng thời có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa dưới sự lãnh đạo của Đảng nhằm bảo đảm định hướng xã hội chủ nghĩa. Mục tiêu của mô hình này là dân giàu, nước mạnh, dân chủ, công bằng, văn minh, gắn tăng trưởng kinh tế với tiến bộ và công bằng xã hội, phát triển bền vững chứ không chạy theo tăng trưởng đơn thuần. Việc xác định mô hình có ý nghĩa tháo gỡ vướng mắc về nhận thức, khẳng định việc phát triển kinh tế thị trường không đối lập với mục tiêu xã hội chủ nghĩa, và tạo khuôn khổ định hướng cho việc phát triển, hoàn thiện thể chế kinh tế."},{"n":18,"q":"Trình bày những bài học kinh nghiệm về sự lãnh đạo của Đảng trong công cuộc đổi mới.","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên khá cao","note":"","out":["Kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội.","Đổi mới sáng tạo trên cơ sở tổng kết thực tiễn, tôn trọng quy luật khách quan.","Lấy nhân dân làm gốc, phát huy quyền làm chủ và sức mạnh đại đoàn kết toàn dân tộc.","Kết hợp sức mạnh dân tộc với sức mạnh thời đại; chủ động hội nhập quốc tế.","Thường xuyên xây dựng, chỉnh đốn Đảng, nâng cao năng lực lãnh đạo và hiệu quả quản lý nhà nước."],"sample":"Trong công cuộc đổi mới, sự lãnh đạo của Đảng để lại nhiều bài học kinh nghiệm. Thứ nhất, phải kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội trên nền tảng chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh. Thứ hai, đổi mới phải sáng tạo, xuất phát từ tổng kết thực tiễn, tôn trọng quy luật khách quan, không bảo thủ nhưng cũng không nóng vội. Thứ ba, phải lấy nhân dân làm gốc, phát huy quyền làm chủ và sức mạnh đại đoàn kết toàn dân tộc. Thứ tư, phải kết hợp sức mạnh dân tộc với sức mạnh thời đại, chủ động và tích cực hội nhập quốc tế. Thứ năm, phải thường xuyên xây dựng, chỉnh đốn Đảng, nâng cao năng lực lãnh đạo và hiệu quả quản lý của Nhà nước. Những bài học này liên hệ chặt chẽ với nhau, cho thấy thành công của đổi mới phụ thuộc vào đường lối đúng đắn và khả năng tổ chức thực hiện đường lối đó."},{"n":19,"q":"Phân tích vai trò của Đảng trong việc xác định đường lối cách mạng phù hợp với từng giai đoạn lịch sử Việt Nam.","part":"PHẦN IV. CÂU HỎI TỔNG HỢP, SO SÁNH VÀ LIÊN HỆ LIÊN CHƯƠNG","pri":"","note":"","out":["Chương 1: xác định con đường giải phóng dân tộc, thành lập Đảng, chuyển hướng chiến lược và lãnh đạo Cách mạng Tháng Tám.","Chương 2: đề ra đường lối kháng chiến phù hợp tương quan lực lượng và tổ chức kháng chiến toàn dân, toàn diện, trường kỳ.","Chương 3: tổng kết thực tiễn, khởi xướng và phát triển đường lối đổi mới.","So sánh điểm chung: xuất phát từ thực tiễn, xác định nhiệm vụ trọng tâm, phát huy sức mạnh nhân dân; nêu sự khác nhau về bối cảnh và nhiệm vụ mỗi thời kỳ."],"sample":"Vai trò quan trọng nhất của Đảng là xác định đường lối cách mạng phù hợp với từng giai đoạn. Ở giai đoạn 1930–1945, Đảng xác định con đường giải phóng dân tộc theo cách mạng vô sản, thành lập Đảng với Cương lĩnh chính trị đầu tiên, chuyển hướng chiến lược đặt nhiệm vụ giải phóng dân tộc lên hàng đầu và lãnh đạo thắng lợi Cách mạng Tháng Tám. Ở giai đoạn 1945–1954, Đảng đề ra đường lối kháng chiến toàn dân, toàn diện, trường kỳ, tự lực cánh sinh phù hợp với tương quan lực lượng, tổ chức kháng chiến đến thắng lợi. Ở giai đoạn từ 1975 đặc biệt từ 1986, Đảng tổng kết thực tiễn, khởi xướng và phát triển đường lối đổi mới. Điểm chung của ba giai đoạn là đường lối đều xuất phát từ thực tiễn, xác định đúng nhiệm vụ trọng tâm và phát huy sức mạnh của nhân dân; điểm khác là bối cảnh và nhiệm vụ của mỗi thời kỳ: giành độc lập, bảo vệ chính quyền và kháng chiến, rồi phát triển đất nước."},{"n":20,"q":"So sánh cách Đảng xác định nhiệm vụ trọng tâm trong ba giai đoạn: 1939–1945, 1945–1954 và từ 1986 đến thời kỳ đổi mới.","part":"PHẦN IV. CÂU HỎI TỔNG HỢP, SO SÁNH VÀ LIÊN HỆ LIÊN CHƯƠNG","pri":"","note":"","out":["1939–1945: đặt giải phóng dân tộc lên hàng đầu, chuẩn bị lực lượng và thời cơ giành chính quyền.","1945–1954: bảo vệ chính quyền cách mạng, kháng chiến chống Pháp và xây dựng lực lượng cho cuộc chiến tranh lâu dài.","Từ 1986: đổi mới toàn diện, trọng tâm trước hết là đổi mới tư duy, đặc biệt tư duy kinh tế, phát triển đất nước.","Phân tích lý do mỗi giai đoạn có nhiệm vụ trọng tâm khác nhau; tránh đánh đồng mục tiêu và phương pháp."],"sample":"Trong giai đoạn 1939–1945, nhiệm vụ trọng tâm của Đảng là giải phóng dân tộc: đặt nhiệm vụ này lên hàng đầu, xây dựng lực lượng và chuẩn bị thời cơ để giành chính quyền, vì mâu thuẫn dân tộc lúc đó gay gắt nhất. Giai đoạn 1945–1954, nhiệm vụ trọng tâm chuyển sang bảo vệ chính quyền cách mạng non trẻ và tiến hành kháng chiến chống thực dân Pháp, đồng thời xây dựng lực lượng cho cuộc chiến tranh lâu dài. Từ năm 1986, khi đất nước đã độc lập, thống nhất nhưng gặp khủng hoảng, nhiệm vụ trọng tâm là đổi mới toàn diện, trước hết là đổi mới tư duy, đặc biệt tư duy kinh tế, để phát triển đất nước. Như vậy mỗi giai đoạn có nhiệm vụ trọng tâm khác nhau do hoàn cảnh lịch sử khác nhau: lần lượt là giành độc lập, giữ độc lập bằng kháng chiến và xây dựng, phát triển. Khi so sánh cần phân biệt mục tiêu và phương pháp, vì mục tiêu độc lập dân tộc gắn với chủ nghĩa xã hội là xuyên suốt, còn phương pháp thay đổi theo thời kỳ."},{"n":21,"q":"Từ thắng lợi Cách mạng Tháng Tám và kháng chiến chống Pháp, rút ra bài học nào có thể vận dụng khi nghiên cứu công cuộc đổi mới?","part":"PHẦN IV. CÂU HỎI TỔNG HỢP, SO SÁNH VÀ LIÊN HỆ LIÊN CHƯƠNG","pri":"","note":"","out":["Kiên định mục tiêu nhưng linh hoạt về sách lược và phương pháp.","Phát huy sức mạnh nhân dân và đại đoàn kết toàn dân tộc.","Chủ động nắm bắt thời cơ, dự báo tình hình và chuẩn bị điều kiện thực hiện mục tiêu.","Xuất phát từ thực tiễn, tổng kết kinh nghiệm, điều chỉnh cách làm khi điều kiện thay đổi.","Chỉ rõ đây là liên hệ bài học lịch sử, không đồng nhất bối cảnh chiến tranh với bối cảnh phát triển kinh tế thời bình."],"sample":"Từ thắng lợi của Cách mạng Tháng Tám và kháng chiến chống Pháp có thể rút ra những bài học có giá trị tham khảo khi nghiên cứu công cuộc đổi mới. Một là kiên định mục tiêu nhưng linh hoạt về sách lược và phương pháp: Đảng giữ vững mục tiêu độc lập dân tộc, nhưng khi tình hình thay đổi thì điều chỉnh cách làm như hòa hoãn với Pháp năm 1946 hay đổi mới cơ chế quản lý kinh tế sau năm 1986. Hai là phát huy sức mạnh của nhân dân và khối đại đoàn kết toàn dân tộc. Ba là chủ động nắm bắt thời cơ, dự báo tình hình và chuẩn bị điều kiện để thực hiện mục tiêu. Bốn là xuất phát từ thực tiễn, tổng kết kinh nghiệm và kịp thời điều chỉnh. Tuy nhiên cần nhấn mạnh đây chỉ là sự liên hệ bài học lịch sử; không thể đồng nhất bối cảnh chiến tranh giành độc lập với bối cảnh phát triển kinh tế trong thời bình, vì nhiệm vụ, lực lượng và phương thức thực hiện đều khác nhau."},{"n":22,"q":"Phân tích sự vận dụng quan điểm lấy dân làm gốc trong các giai đoạn lịch sử được học.","part":"PHẦN IV. CÂU HỎI TỔNG HỢP, SO SÁNH VÀ LIÊN HỆ LIÊN CHƯƠNG","pri":"","note":"","out":["Chương 1: huy động quần chúng trong các phong trào cách mạng và Tổng khởi nghĩa.","Chương 2: kháng chiến toàn dân, xây dựng hậu phương và bảo vệ chính quyền.","Chương 3: phát huy quyền làm chủ của nhân dân, gắn phát triển kinh tế với nâng cao đời sống và công bằng xã hội.","Kết luận về vai trò quyết định của nhân dân, đồng thời nêu yêu cầu chính sách phải xuất phát từ lợi ích chính đáng của nhân dân."],"sample":"Quan điểm lấy dân làm gốc được Đảng vận dụng xuyên suốt qua các giai đoạn lịch sử. Trong giai đoạn 1930–1945, Đảng tập hợp, tổ chức quần chúng trong các phong trào cách mạng, từ phong trào 1930–1931, Mặt trận Việt Minh cho đến Tổng khởi nghĩa tháng Tám, thắng lợi của cách mạng chính là thắng lợi của sức mạnh quần chúng. Trong giai đoạn 1945–1954, Đảng lãnh đạo kháng chiến toàn dân, xây dựng hậu phương, bảo vệ chính quyền cách mạng bằng sức dân. Trong thời kỳ đổi mới, Đảng chủ trương phát huy quyền làm chủ của nhân dân, gắn phát triển kinh tế với nâng cao đời sống và bảo đảm công bằng xã hội; bài học lấy nhân dân làm gốc được Đảng khẳng định trong tổng kết 30 năm đổi mới. Như vậy nhân dân là lực lượng quyết định thành bại của sự nghiệp cách mạng, và các chủ trương, chính sách của Đảng phải xuất phát từ lợi ích chính đáng của nhân dân thì mới có sức sống và được nhân dân ủng hộ."}],"tips":["Vòng 1: học trước các câu “Ưu tiên cao”: 7 câu Chương 1, 5 câu Chương 2, 4 câu Chương 3; sau đó làm nốt 2 câu “Ưu tiên khá cao” của Chương 3.","Vòng 2: luyện 4 câu liên chương; tập viết câu mở đầu, 4–6 luận điểm và kết luận trong thời gian giới hạn.","Vòng 3: che dàn ý, tự nói hoặc viết lại từ trí nhớ; chỉ mở tài liệu để kiểm tra phần còn thiếu.","Với câu có nhiều mốc, học theo chuỗi: bối cảnh → hội nghị/đại hội → chủ trương → kết quả → ý nghĩa.","Đừng học thuộc nguyên văn dàn ý này như đáp án chính thức; hãy đối chiếu thuật ngữ và yêu cầu của giảng viên."]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
const KEY='lsd-on-tap-v1';
let S={theme:'',exam:'',st:{},bm:{},known:{},chk:{},es:{},tab:'home'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const CH=D.chapters,chap=id=>CH.find(c=>c.id==id);
const ALLQ=CH.flatMap(c=>c.mcq.map((q,i)=>({...q,id:c.id+'-'+i,ch:c.id,n:i+1})));
const ALLT=CH.flatMap(c=>c.timeline.map((t,i)=>({d:t[0],e:t[1],id:'t'+c.id+'-'+t[0],ch:c.id})));
const TABS=[['home','Tổng quan','🏠'],['study','Học','📖'],['time','Mốc','🕒'],['card','Thẻ','🃏'],['quiz','Trắc nghiệm','✅'],['essay','Tự luận','✍️']];
const chips=(cur,act,all=true)=>`<div class="pills">${all?`<button class="pill ${cur==0?'on':''}" data-a="${act}" data-v="0">Tất cả</button>`:''}${CH.map(c=>`<button class="pill ${cur==c.id?'on':''}" data-a="${act}" data-v="${c.id}">${c.title}</button>`).join('')}</div>`;
const bar=p=>`<div class="bar"><i style="width:${Math.round(p)}%"></i></div>`;
function applyTheme(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme')}

/* ---------- HOME ---------- */
function home(){
  const att=ALLQ.filter(q=>S.st[q.id]),good=att.filter(q=>S.st[q.id].last).length,wrong=att.length-good;
  const kn=ALLT.filter(t=>S.known[t.id]).length,ed=Object.values(S.es).filter(x=>x.done).length;
  const days=S.exam?Math.ceil((new Date(S.exam+'T00:00')-new Date(new Date().toDateString()))/864e5):null;
  const cd=days===null?'':days>0?`⏳ Còn <b>${days}</b> ngày đến kỳ thi`:days===0?'🔥 Hôm nay thi, cố lên!':'Kỳ thi đã qua';
  return `<div class="card"><h2>Chào bạn, hôm nay ôn gì nào?</h2><p class="mu">Gợi ý vòng ôn: đọc tóm tắt → học mốc & thẻ → làm trắc nghiệm → tập viết dàn ý tự luận.</p>
  <div class="row"><button class="btn p" data-a="go" data-v="quiz">Làm trắc nghiệm</button><button class="btn" data-a="exam30">Thi thử (40 TN + 1 TL)</button><button class="btn" data-a="wrongq" ${wrong?'':'disabled'}>Ôn ${wrong} câu sai</button></div></div>
  <div class="grid"><div class="card stat"><b>${att.length}/${ALLQ.length}</b><small>Câu đã làm</small></div><div class="card stat"><b>${att.length?Math.round(good/att.length*100):0}%</b><small>Đúng (lần gần nhất)</small></div><div class="card stat"><b>${kn}/${ALLT.length}</b><small>Thẻ mốc đã thuộc</small></div><div class="card stat"><b>${ed}/${D.essay.length}</b><small>Câu tự luận đã ôn</small></div></div>
  <div class="card"><h3>Tiến độ theo chương</h3>${CH.map(c=>{const qs=ALLQ.filter(q=>q.ch==c.id),g=qs.filter(q=>S.st[q.id]&&S.st[q.id].last).length;return `<p class="mu" style="margin-bottom:2px"><b>${c.title}</b> · ${c.sub} — ${g}/${qs.length} câu đúng</p>${bar(g/qs.length*100)}`}).join('')}</div>
  <div class="card"><h3>Lịch thi</h3><div class="row"><input type="date" id="exd" value="${S.exam}" style="max-width:190px"><span>${cd}</span></div></div>
  <div class="card"><h3>Mẹo ôn nhanh</h3>${D.tips.map(t=>`<p>• ${md(t)}</p>`).join('')}</div>
  <p class="row"><button class="btn s" data-a="reset" id="rs">Xóa toàn bộ tiến độ</button></p>`;
}

/* ---------- STUDY ---------- */
let stCh=1,stQ='';
const items=a=>{let o='',rows=[];const fr=()=>{if(rows.length){o+=`<div style="overflow-x:auto"><table>${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${md(c)}</td>`:`<th>${md(c)}</th>`).join('')}</tr>`).join('')}</table></div>`;rows=[]}};
  for(const x of a){if(typeof x==='string'&&x.startsWith('||')){rows.push(x.slice(2).replace(/\|\s*$/,'').split('|').map(c=>c.trim()));continue}fr();o+=typeof x==='string'?`<p>${md(x)}</p>`:`<details class="sub" open><summary>${esc(x.h)}</summary>${items(x.items)}</details>`}fr();return o};
const flat=a=>a.flatMap(x=>typeof x==='string'?[x]:[x.h,...flat(x.items)]);
function studyBody(){
  const q=norm(stQ.trim());
  if(q){const out=[];CH.forEach(c=>{c.sections.forEach(s=>flat(s.items).forEach(t=>norm(t).includes(q)&&out.push([c.title,t])));c.confuse.forEach(t=>norm(t).includes(q)&&out.push([c.title+' · Dễ nhầm',t]));c.timeline.forEach(t=>norm(t[0]+' '+t[1]).includes(q)&&out.push([c.title+' · Mốc',t[0]+': '+t[1]]))});
    return out.length?out.slice(0,60).map(o=>`<div class="card"><span class="tag">${o[0]}</span><p>${md(o[1].replace(/^\|\|/,'').replace(/\|/g,' — '))}</p></div>`).join(''):'<p class="mu">Không tìm thấy kết quả.</p>'}
  const c=chap(stCh);
  return `<div class="card"><h2>${c.title}: ${c.sub}</h2>${c.sections.map(s=>`<details open><summary>${esc(s.h)}</summary>${items(s.items)}</details>`).join('')}</div>
  <div class="card"><h3>⚠️ Những nội dung dễ nhầm</h3>${c.confuse.map(t=>`<div class="warn">${md(t)}</div>`).join('')}</div>
  <div class="card"><h3>☑️ Checklist tự kiểm tra</h3>${c.check.map((t,i)=>`<label class="ck"><input type="checkbox" data-a="chk" data-k="${c.id}-${i}" ${S.chk[c.id+'-'+i]?'checked':''}><span>${md(t)}</span></label>`).join('')}</div>`;
}
function study(){return `${chips(stCh,'stch',false)}<input type="search" id="sq" placeholder="🔍 Tìm trong toàn bộ tài liệu (mốc, hội nghị, khái niệm…)" value="${esc(stQ)}"><div id="sb">${studyBody()}</div>`}

/* ---------- TIMELINE ---------- */
let tCh=0,tQ='',tHide=false;
function timeBody(){const q=norm(tQ.trim());const l=ALLT.filter(t=>(!tCh||t.ch==tCh)&&(!q||norm(t.d+' '+t.e).includes(q)));
  return l.length?`<div class="card">${l.map(t=>`<div class="tl"><b>${esc(t.d)}</b><span class="${tHide?'hid':''}" data-a="rev">${esc(t.e)}</span></div>`).join('')}</div>`:'<p class="mu">Không có mốc phù hợp.</p>'}
function time(){return `${chips(tCh,'tch')}<div class="row"><input type="search" id="tq" placeholder="🔍 Tìm mốc / sự kiện" value="${esc(tQ)}" style="flex:1;min-width:180px"><label class="ck"><input type="checkbox" data-a="thide" ${tHide?'checked':''}><span>Tự kiểm tra (ẩn sự kiện, bấm để hiện)</span></label></div><div id="tb">${timeBody()}</div>`}

/* ---------- FLASHCARDS ---------- */
let F={ch:0,unk:false,rev:false,deck:null,i:0,flip:false};
function buildDeck(){F.deck=shuf(ALLT.filter(t=>(!F.ch||t.ch==F.ch)&&(!F.unk||!S.known[t.id])));F.i=0;F.flip=false}
function card(){
  if(!F.deck)buildDeck();
  const t=F.deck[F.i],n=F.deck.length;
  const head=`${chips(F.ch,'fch')}<div class="row"><label class="ck"><input type="checkbox" data-a="funk" ${F.unk?'checked':''}><span>Chỉ thẻ chưa thuộc</span></label><label class="ck"><input type="checkbox" data-a="frev" ${F.rev?'checked':''}><span>Đảo mặt (sự kiện → mốc)</span></label><span class="sp"></span><button class="btn s" data-a="fshuf">🔀 Trộn lại</button></div>`;
  if(!t)return head+`<div class="card"><h2>🎉 Hết bộ thẻ!</h2><p>Bạn đã thuộc hết thẻ trong bộ lọc này.</p></div>`;
  const front=F.rev?t.e:t.d,back=F.rev?t.d:t.e;
  return head+`<p class="mu">Thẻ ${F.i+1}/${n} · Đã thuộc ${ALLT.filter(x=>S.known[x.id]).length}/${ALLT.length} · Bấm thẻ hoặc phím Space để lật</p><div class="fc ${F.flip?'back':''}" data-a="flip">${esc(F.flip?back:front)}</div>
  <div class="row"><button class="btn" data-a="fprev">← Trước</button><span class="sp"></span><button class="btn no" data-a="fno">Chưa thuộc</button><button class="btn ok" data-a="fyes">Đã thuộc ✓</button><span class="sp"></span><button class="btn" data-a="fnext">Sau →</button></div>`;
}

/* ---------- QUIZ ---------- */
let Z={ch:{1:1,2:1,3:1},mode:'practice',n:20,src:'all',t:60},Q=null,tmr=null;
const src={all:'Tất cả câu',wrong:'Câu làm sai',new:'Câu chưa làm',bm:'Câu đã đánh dấu ⭐'};
function pool(){return ALLQ.filter(q=>Z.ch[q.ch]&&(Z.src==='all'||(Z.src==='wrong'&&S.st[q.id]&&!S.st[q.id].last)||(Z.src==='new'&&!S.st[q.id])||(Z.src==='bm'&&S.bm[q.id])))}
function essayPool(){const n=Object.values(Z.ch).filter(Boolean).length;const l=D.essay.filter(e=>{const g=grp(e);return g==='x'?n>=2:Z.ch[g]});return l.length?l:D.essay}
function setup(){const p=pool().length,ex=Z.mode=='exam';
  return `<div class="card"><h2>Cài đặt bài làm</h2><p><b>Chương</b></p><div class="pills">${CH.map(c=>`<button class="pill ${Z.ch[c.id]?'on':''}" data-a="zch" data-v="${c.id}">${c.title}</button>`).join('')}</div>
  <p><b>Nguồn câu hỏi</b></p><div class="pills">${Object.entries(src).map(([k,v])=>`<button class="pill ${Z.src==k?'on':''}" data-a="zsrc" data-v="${k}">${v}</button>`).join('')}</div>
  <p><b>Chế độ</b></p><div class="pills"><button class="pill ${Z.mode=='practice'?'on':''}" data-a="zmode" data-v="practice">Luyện tập (xem đáp án ngay)</button><button class="pill ${ex?'on':''}" data-a="zmode" data-v="exam">Thi thử: 40 trắc nghiệm + 1 tự luận</button></div>
  ${ex?`<p><b>Thời gian làm bài</b></p><div class="pills">${[45,60,90].map(n=>`<button class="pill ${Z.t==n?'on':''}" data-a="zt" data-v="${n}">${n} phút</button>`).join('')}</div>`:`<p><b>Số câu</b></p><div class="pills">${[10,20,30,0].map(n=>`<button class="pill ${Z.n==n?'on':''}" data-a="zn" data-v="${n}">${n||'Tất cả'}</button>`).join('')}</div>`}
  <p class="mu">Có <b>${p}</b> câu trắc nghiệm phù hợp bộ lọc.${ex?` Đề thi thử gồm <b>${Math.min(40,p)}</b> câu trắc nghiệm ngẫu nhiên + <b>1 câu tự luận</b> ngẫu nhiên (chấm cuối bài, phần tự luận bạn tự đối chiếu dàn ý).`:' Đáp án được xáo trộn mỗi lần làm.'}</p><button class="btn p" data-a="zstart" ${p?'':'disabled'}>Bắt đầu ▶</button></div>`}
const tmFmt=l=>{l=Math.max(0,l);return Math.floor(l/60000)+':'+String(Math.floor(l/1000)%60).padStart(2,'0')};
const egText=()=>`Tự chấm: ${Q.eg.filter(Boolean).length}/${Q.essay.out.length} ý`;
function startQuiz(list,redo){
  clearInterval(tmr);list=shuf(list);const ex=Z.mode==='exam'&&!redo;
  if(ex)list=list.slice(0,40);else if(!redo&&Z.n&&Z.n<list.length)list=list.slice(0,Z.n);
  const ep=ex?essayPool():[];
  Q={list:list.map(q=>({q,o:shuf([...q.o.keys()])})),i:0,ans:list.map(()=>null),mode:Z.mode,done:false,t0:Date.now(),essay:ep.length?ep[Math.random()*ep.length|0]:null,eans:'',eg:[]};
  Q.end=Date.now()+(redo?list.length:Z.t)*60000;
  if(Q.mode==='exam')tmr=setInterval(()=>{const l=Q.end-Date.now();if(l<=0){finish()}else{const e=$('#tm');if(e)e.textContent=tmFmt(l)}},1000);
  go('quiz')}
function rec(q,ok){const s=S.st[q.id]||(S.st[q.id]={r:0,w:0});ok?s.r++:s.w++;s.last=ok}
function finish(){if(!Q||Q.done)return;clearInterval(tmr);Q.done=true;Q.dur=Date.now()-Q.t0;if(Q.mode==='exam')Q.list.forEach((x,i)=>rec(x.q,Q.ans[i]===x.q.a));save();if(S.tab==='quiz')render()}
function quiz(){
  if(!Q)return setup();
  if(Q.done)return result();
  const n=Q.list.length,T=n+(Q.essay?1:0),pr=Q.mode==='practice',isE=Q.essay&&Q.i===n,x=Q.list[Q.i],q=x&&x.q,a=Q.ans[Q.i],lock=pr&&a!==null;
  const grid=Q.mode==='exam'?`<div class="qg">${Q.ans.map((v,i)=>`<button class="${v!==null?'a':''} ${i==Q.i?'c':''}" data-a="qjump" data-v="${i}">${i+1}</button>`).join('')}${Q.essay?`<button style="width:auto;padding:0 8px" class="${Q.eans.trim()?'a':''} ${isE?'c':''}" data-a="qjump" data-v="${n}">TL</button>`:''}</div>`:'';
  const top=`<div class="row"><span class="mu">${isE?'Câu tự luận':`Câu ${Q.i+1}/${n} · Chương ${q.ch}`}</span><span class="sp"></span>${Q.mode==='exam'?`<b>⏱ <span id="tm">${tmFmt(Q.end-Date.now())}</span></b>`:''}${isE?'':`<button class="btn s" data-a="bm" data-k="${q.id}">${S.bm[q.id]?'⭐ Đã lưu':'☆ Đánh dấu'}</button>`}${Q.mode==='exam'?'<button class="btn s p" data-a="qsub">Nộp bài</button>':''}<button class="btn s" data-a="qquit">Thoát</button></div>${bar((Q.i+(lock?1:0))/T*100)}${grid}`;
  let body;
  if(isE)body=`<div class="card"><h3>Câu tự luận (câu ${n+1}/${T})</h3><p><b>${esc(Q.essay.q)}</b></p><textarea id="eta" style="min-height:240px" placeholder="Viết bài làm của bạn: mở bài – các luận điểm có mốc thời gian – kết luận…">${esc(Q.eans)}</textarea><p class="mu">Dàn ý gợi ý chỉ hiện sau khi nộp bài để bạn tự đối chiếu.</p></div>`;
  else{const opts=x.o.map((oi,k)=>{let c='';if(lock)c=oi===q.a?'right':oi===a?'wrong':'';else if(a===oi)c='sel';return `<button class="opt ${c}" data-a="pick" data-v="${oi}"><i>${'ABCD'[k]}.</i><span>${esc(q.o[oi])}</span></button>`}).join('');
    body=`<div class="card"><h3>${md(q.q)}</h3>${opts}${lock?`<div class="exp">${a===q.a?'✅ <b>Chính xác!</b>':'❌ <b>Chưa đúng.</b>'} ${md(q.e||'')}</div>`:''}</div>`}
  return top+body+`<div class="row"><button class="btn" data-a="qprev" ${Q.i?'':'disabled'}>← Trước</button><span class="sp"></span>${Q.i<T-1?`<button class="btn p" data-a="qnext" ${pr&&!lock?'disabled':''}>${Q.i==n-1&&Q.essay?'Sang câu tự luận →':'Câu tiếp →'}</button>`:`<button class="btn p" data-a="${pr?'qfin':'qsub'}" ${pr&&!lock?'disabled':''}>Nộp bài ✓</button>`}</div>`}
function result(){
  const n=Q.list.length,ok=Q.list.filter((x,i)=>Q.ans[i]===x.q.a).length,bad=Q.list.map((x,i)=>[x,i]).filter(([x,i])=>Q.ans[i]!==x.q.a);
  const m=Math.floor(Q.dur/60000),s=Math.floor(Q.dur/1000)%60;
  const es=Q.essay?`<div class="card"><h3>✍️ Câu tự luận</h3><p><b>${esc(Q.essay.q)}</b></p><p class="mu">Bài làm của bạn:</p><div class="exp" style="white-space:pre-wrap;text-align:left">${Q.eans.trim()?esc(Q.eans):'(bỏ trống)'}</div><p class="mu" style="margin-top:12px">Đối chiếu dàn ý gợi ý, tích các ý bạn đã nêu để tự chấm:</p>${Q.essay.out.map((o,i)=>`<label class="ck"><input type="checkbox" data-a="ecg" data-k="${i}" ${Q.eg[i]?'checked':''}><span>${md(o)}</span></label>`).join('')}<p><b id="egs">${egText()}</b></p>${Q.essay.sample?`<details class="sample"><summary>📝 Xem đoạn trả lời mẫu</summary><div class="exp">${md(Q.essay.sample)}</div></details>`:''}</div>`:'';
  return `<div class="card"><div class="big">${ok}/${n}</div><p style="text-align:center">phần trắc nghiệm · ${Math.round(ok/n*100)}% đúng · thang 10: <b>${(ok/n*10).toFixed(1)}</b> · thời gian ${m}p${s}s<br>${ok/n>=.8?'Rất tốt! 🎉':ok/n>=.5?'Khá ổn, ôn thêm các câu sai nhé.':'Cần ôn lại nhiều hơn, đọc phần Học trước nhé.'}${Q.essay?'<br>Phần tự luận: tự chấm ở bên dưới.':''}</p>
  <div class="row" style="justify-content:center"><button class="btn p" data-a="qredo" ${bad.length?'':'disabled'}>Làm lại ${bad.length} câu sai</button><button class="btn" data-a="qquit">Đề mới</button></div></div>${es}
  ${bad.length?`<h3>Các câu trắc nghiệm cần xem lại</h3>`:''}${bad.map(([x,i])=>`<div class="card"><p><b>Câu ${i+1}.</b> ${md(x.q.q)}</p><p style="color:var(--no)">Bạn chọn: ${Q.ans[i]===null?'(bỏ trống)':esc(x.q.o[Q.ans[i]])}</p><p style="color:var(--ok)">Đáp án đúng: ${esc(x.q.o[x.q.a])}</p><div class="exp">${md(x.q.e||'')}</div></div>`).join('')}`}

/* ---------- ESSAY ---------- */
let eF='0',eHigh=false,eHide=false;
const grp=e=>e.part.includes('PHẦN IV')?'x':(e.part.match(/CHƯƠNG (\d)/)||[])[1];
function essay(){
  const l=D.essay.filter(e=>(eF==='0'||grp(e)===eF)&&(!eHigh||/^Ưu tiên cao$/.test(e.pri)));
  const f=[['0','Tất cả'],['1','Chương 1'],['2','Chương 2'],['3','Chương 3'],['x','Liên chương']];
  return `<div class="pills">${f.map(([k,v])=>`<button class="pill ${eF==k?'on':''}" data-a="ef" data-v="${k}">${v}</button>`).join('')}</div>
  <div class="row"><label class="ck"><input type="checkbox" data-a="ehigh" ${eHigh?'checked':''}><span>Chỉ câu “Ưu tiên cao”</span></label><label class="ck"><input type="checkbox" data-a="ehide" ${eHide?'checked':''}><span>Che dàn ý để tự trả lời trước</span></label></div>
  <p class="mu">Bộ câu hỏi dự đoán để luyện tập, không phải đề thi đã xác nhận. Hãy đối chiếu thuật ngữ với giáo trình.</p>
  ${l.map(e=>{const st=S.es[e.n]||{};return `<div class="card"><details ${eHide?'':'open'}><summary><span class="tag">${e.pri||'Liên chương'}</span> Câu ${e.n}. ${esc(e.q)}</summary>${e.note?`<div class="warn">${md(e.note)}</div>`:''}<ol>${e.out.map(o=>`<li>${md(o)}</li>`).join('')}</ol></details>
  <textarea data-a="enote" data-k="${e.n}" placeholder="Viết dàn ý / câu trả lời của bạn ở đây (tự động lưu)…">${esc(st.note||'')}</textarea><label class="ck"><input type="checkbox" data-a="edone" data-k="${e.n}" ${st.done?'checked':''}><span>Đã ôn xong câu này</span></label>${e.sample?`<details class="sample"><summary>📝 Xem đoạn trả lời mẫu</summary><div class="exp">${md(e.sample)}</div><p class="mu">Đoạn mẫu để tham khảo cách triển khai. Hãy diễn đạt lại bằng lời của bạn và đối chiếu mốc, thuật ngữ với giáo trình.</p></details>`:''}</div>`}).join('')}`}

/* ---------- ROUTER ---------- */
const VIEWS={home,study,time,card,quiz,essay};
function go(t){S.tab=t;save();render();window.scrollTo(0,0)}
function render(){
  $('#nav').innerHTML=TABS.map(([k,v,i])=>`<button class="${S.tab==k?'on':''}" data-a="go" data-v="${k}"><span>${i}</span>${v}</button>`).join('');
  $('#app').innerHTML=VIEWS[S.tab]();
}
const A={
  go:d=>go(d.v),theme:()=>{const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';applyTheme();save()},
  exam30:()=>{const sz=Z;Z={...sz,ch:{1:1,2:1,3:1},mode:'exam',n:40,src:'all',t:sz.t||60};S.tab='quiz';startQuiz(pool());Z=sz},
  wrongq:()=>{const sz=Z;Z={...sz,ch:{1:1,2:1,3:1},mode:'practice',n:0,src:'wrong'};S.tab='quiz';startQuiz(pool());Z=sz},
  reset:(d,t)=>{if(t.dataset.s){S={theme:S.theme,exam:'',st:{},bm:{},known:{},chk:{},es:{},tab:'home'};Q=null;F.deck=null;save();render()}else{t.dataset.s=1;t.textContent='Bấm lần nữa để xác nhận xóa'}},
  stch:d=>{stCh=+d.v;stQ='';render()},tch:d=>{tCh=+d.v;render()},rev:(d,t)=>{if(tHide)t.classList.toggle('hid')},
  thide:(d,t)=>{tHide=t.checked;$('#tb').innerHTML=timeBody()},chk:(d,t)=>{t.checked?S.chk[d.k]=1:delete S.chk[d.k];save()},
  fch:d=>{F.ch=+d.v;buildDeck();render()},funk:(d,t)=>{F.unk=t.checked;buildDeck();render()},frev:(d,t)=>{F.rev=t.checked;F.flip=false;render()},fshuf:()=>{buildDeck();render()},
  flip:()=>{F.flip=!F.flip;render()},fprev:()=>{F.i=(F.i-1+F.deck.length)%F.deck.length;F.flip=false;render()},fnext:()=>{F.i=(F.i+1)%F.deck.length;F.flip=false;render()},
  fyes:()=>{S.known[F.deck[F.i].id]=1;save();A.fnext()},fno:()=>{delete S.known[F.deck[F.i].id];save();A.fnext()},
  zch:d=>{Z.ch[d.v]=!Z.ch[d.v];render()},zsrc:d=>{Z.src=d.v;render()},zmode:d=>{Z.mode=d.v;render()},zn:d=>{Z.n=+d.v;render()},zt:d=>{Z.t=+d.v;render()},zstart:()=>startQuiz(pool()),
  pick:d=>{const v=+d.v;if(Q.mode==='practice'){if(Q.ans[Q.i]!==null)return;Q.ans[Q.i]=v;const q=Q.list[Q.i].q;rec(q,v===q.a);save()}else Q.ans[Q.i]=v;render()},
  qnext:()=>{Q.i++;render();scrollTo(0,0)},qprev:()=>{Q.i--;render();scrollTo(0,0)},qjump:d=>{Q.i=+d.v;render();scrollTo(0,0)},
  qfin:()=>{if(Q.mode==='practice'){Q.list.forEach((x,i)=>{if(Q.ans[i]===null){rec(x.q,false)}});}Q.mode==='practice'?(clearInterval(tmr),Q.done=true,Q.dur=Date.now()-Q.t0,save(),render()):finish()},
  qquit:()=>{clearInterval(tmr);Q=null;render()},
  qredo:()=>{const l=Q.list.filter((x,i)=>Q.ans[i]!==x.q.a).map(x=>x.q);const sm=Z.mode;Z.mode=Q.mode;startQuiz(l,true);Z.mode=sm},
  qsub:(d,t)=>{if(t.dataset.s){finish()}else{const k=Q.ans.filter(v=>v===null).length;t.dataset.s=1;t.textContent=k?`Còn ${k} câu trống – bấm lại để nộp`:'Bấm lại để nộp bài';setTimeout(()=>{if(t.isConnected){delete t.dataset.s;t.textContent='Nộp bài'}},4000)}},
  ecg:(d,t)=>{Q.eg[+d.k]=t.checked;$('#egs').textContent=egText()},
  bm:(d,t)=>{S.bm[d.k]?delete S.bm[d.k]:S.bm[d.k]=1;save();t.textContent=S.bm[d.k]?'⭐ Đã lưu':'☆ Đánh dấu'},
  ef:d=>{eF=d.v;render()},ehigh:(d,t)=>{eHigh=t.checked;render()},ehide:(d,t)=>{eHide=t.checked;render()},
  edone:(d,t)=>{(S.es[d.k]||(S.es[d.k]={})).done=t.checked;save()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.tagName==='TEXTAREA'||t.type==='checkbox'&&e.type==='click'&&false)return;if(t.type==='checkbox')return;A[t.dataset.a]?.(t.dataset,t,e)});
document.addEventListener('change',e=>{const t=e.target;if(t.type==='checkbox'&&t.dataset.a)A[t.dataset.a]?.(t.dataset,t,e);if(t.id==='exd'){S.exam=t.value;save();render()}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='sq'){stQ=t.value;$('#sb').innerHTML=studyBody()}
  else if(t.id==='tq'){tQ=t.value;$('#tb').innerHTML=timeBody()}
  else if(t.id==='eta'&&Q)Q.eans=t.value;
  else if(t.dataset.a==='enote'){(S.es[t.dataset.k]||(S.es[t.dataset.k]={})).note=t.value;save()}});
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  if(S.tab==='card'&&F.deck&&F.deck.length){if(e.key===' '){e.preventDefault();A.flip()}else if(e.key==='ArrowRight')A.fnext();else if(e.key==='ArrowLeft')A.fprev();else if(e.key==='1')A.fno();else if(e.key==='2')A.fyes()}
  if(S.tab==='quiz'&&Q&&!Q.done){const cur=Q.list[Q.i];const k=e.key.length===1?'abcd'.indexOf(e.key.toLowerCase()):-1;const n=e.key.length===1?'1234'.indexOf(e.key):-1;const j=k>=0?k:n;
    if(cur&&j>=0&&cur.o[j]!==undefined)A.pick({v:cur.o[j]});
    else if(e.key==='ArrowRight'||e.key==='Enter'){const b=document.querySelector('[data-a=qnext]:not(:disabled)');b&&b.click()}
    else if(e.key==='ArrowLeft'&&Q.i>0)A.qprev()}});
if(!VIEWS[S.tab])S.tab='home';
applyTheme();render();

/* ---------- AUTO UPDATE ---------- */
(()=>{
  const cur=(document.querySelector('meta[name=build]')||{}).content,VK=KEY+'-build';
  if(!cur)return;
  const mk=(c,h)=>{const e=document.createElement('div');e.className=c;if(h)e.innerHTML=h;document.body.appendChild(e);return e};
  try{const old=localStorage.getItem(VK);localStorage.setItem(VK,cur);
    if(old&&old!==cur){const o=mk('upd-toast ok','<span>✨ Đã cập nhật lên bản mới</span>');setTimeout(()=>o.classList.add('on'),200);setTimeout(()=>{o.classList.remove('on');setTimeout(()=>o.remove(),500)},3500)}}catch(e){}
  let shown=false;
  const apply=()=>{
    const ov=mk('upd-ov','<div class="upd-ring"><div class="upd-ico">🚀</div></div><div class="upd-tx">Đang cập nhật…</div><div class="upd-sub">Tiến độ học của bạn được giữ nguyên</div><div class="upd-bar"><i></i></div>');
    requestAnimationFrame(()=>ov.classList.add('on'));
    setTimeout(()=>location.reload(),2000)};
  const offer=()=>{
    if(shown)return;shown=true;
    const busy=Q&&!Q.done,tt=mk('upd-toast','<span>🆕 Có bản cập nhật mới</span><button>Cập nhật</button>');
    setTimeout(()=>tt.classList.add('on'),50);
    tt.querySelector('button').onclick=()=>{tt.remove();apply()};
    if(!busy)setTimeout(()=>{if(tt.isConnected){tt.remove();apply()}},6000)}; // đang làm bài thì chỉ nhắc, không tự tải lại
  const check=async()=>{
    if(shown||document.hidden)return;
    try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!r.ok)return;
      const m=(await r.text()).match(/<meta name="build" content="([^"]*)"/);
      if(m&&m[1]!==cur)offer()}catch(e){}};
  setInterval(check,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  addEventListener('online',check);
  window.__checkUpdate=check;
})();


/* ---------- ONLINE PRESENCE (Supabase Realtime) ----------
   Điền 2 giá trị bên dưới (Project URL + anon public key). Để trống = tắt tính năng, không hiện gì. */
const PRESENCE={url:'https://qkxmifohzmcvtgkvtybg.supabase.co',key:'sb_publishable_wotB5PqvLRulx2BMWTkZ1Q_r12x7lwt'};
(()=>{
  const el=document.getElementById('online');if(!el||!PRESENCE.url||!PRESENCE.key)return;
  const num=el.querySelector('b');
  const show=n=>{if(String(n)!==num.textContent){num.textContent=n;num.classList.add('bump');setTimeout(()=>num.classList.remove('bump'),250)}el.hidden=false};
  const start=()=>{
    let ch;
    try{
      const sb=window.supabase.createClient(PRESENCE.url,PRESENCE.key,{realtime:{params:{eventsPerSecond:5}}});
      const id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2));
      ch=sb.channel('lsd-online',{config:{presence:{key:id}}});
      ch.on('presence',{event:'sync'},()=>show(Math.max(1,Object.keys(ch.presenceState()).length)));
      ch.subscribe(st=>{if(st==='SUBSCRIBED'&&!document.hidden)ch.track({at:Date.now()});
        if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')el.hidden=true});
      // chỉ tính người đang thật sự xem: ẩn tab thì bỏ đếm, quay lại thì đếm lại
      document.addEventListener('visibilitychange',()=>{try{document.hidden?ch.untrack():ch.track({at:Date.now()})}catch(e){}});
    }catch(e){el.hidden=true}
  };
  if(window.supabase)start();
  else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';s.onload=start;s.onerror=()=>{el.hidden=true};document.head.appendChild(s)}
})();

/* ---------- SPLASH ---------- */
(()=>{const s=document.getElementById('splash');if(!s)return;const t0=performance.now();let done=false;
  const hide=()=>{if(done)return;done=true;s.classList.add('out');setTimeout(()=>s.remove(),700)};
  const go=()=>setTimeout(hide,Math.max(0,1700-(performance.now()-t0)));
  document.readyState==='complete'?go():addEventListener('load',go);
  setTimeout(hide,5000)})();
</script>
