<title>Ôn tập Lịch sử Đảng</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e4e0d6;--pr:#b3261e;--pr2:#fde8e6;--ok:#1a7f4b;--ok2:#e2f5ea;--no:#c62828;--no2:#fdeaea;--ac:#8a6d1d;--ac2:#fbf3d9;--on:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--tx:#e8e6e1;--mu:#9aa0a8;--bd:#32363c;--pr:#ff8a80;--pr2:#3a2220;--ok:#6fd9a0;--ok2:#17301f;--no:#ff8a80;--no2:#3a2020;--ac:#e5c15d;--ac2:#33290f;--on:#15171a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171a;--card:#1f2226;--tx:#e8e6e1;--mu:#9aa0a8;--bd:#32363c;--pr:#ff8a80;--pr2:#3a2220;--ok:#6fd9a0;--ok2:#17301f;--no:#ff8a80;--no2:#3a2020;--ac:#e5c15d;--ac2:#33290f;--on:#15171a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:76px}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;max-width:860px;margin:auto}
header h1{font-size:19px;margin:0;flex:1;color:var(--pr)}
main{max-width:860px;margin:auto;padding:8px 16px 24px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:4px 0;cursor:pointer;border-radius:8px}
nav button span{display:block;font-size:19px;line-height:1.2}nav button.on{color:var(--pr);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}
h2{font-size:18px;margin:6px 0}h3{font-size:16px;margin:4px 0}p{margin:6px 0}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--pr);color:var(--on);border-color:var(--pr)}.btn.ok{background:var(--ok);color:var(--on);border-color:var(--ok)}.btn.no{background:var(--no);color:var(--on);border-color:var(--no)}
.btn:disabled{opacity:.45;cursor:default}.btn.s{padding:5px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.pill.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
input[type=search],input[type=date],textarea,select{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
textarea{min-height:80px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:26px;color:var(--pr)}.stat small{color:var(--mu)}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
details{margin:6px 0}summary{cursor:pointer;font-weight:600;padding:4px 0}details.sub{margin-left:8px;padding-left:10px;border-left:3px solid var(--bd)}
.warn{background:var(--ac2);border-left:4px solid var(--ac);padding:8px 12px;border-radius:8px;margin:8px 0}
.tl{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--bd)}.tl b{flex:0 0 120px;color:var(--pr)}
.hid{filter:blur(6px);cursor:pointer;user-select:none}
.fc{min-height:230px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;padding:24px;cursor:pointer;background:var(--card);border:2px solid var(--bd);border-radius:18px;margin:12px 0}
.fc.back{border-color:var(--pr);background:var(--pr2)}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:11px 13px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;border-radius:12px;cursor:pointer}
.opt i{font-style:normal;font-weight:700;color:var(--mu)}.opt.sel{border-color:var(--pr);background:var(--pr2)}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.wrong{border-color:var(--no);background:var(--no2)}
.exp{background:var(--ac2);border-radius:10px;padding:10px 12px;margin-top:10px}

.upd-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:99px;background:var(--tx);color:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .3s;max-width:calc(100vw - 24px)}

.upd-ov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,12,16,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;opacity:0;transition:opacity .35s}
.upd-ov.on{opacity:1}
.upd-ring{position:relative;width:112px;height:112px;border-radius:50%;background:conic-gradient(from 0deg,#ff5a4f,#ffd34d,#3ddc97,#4da3ff,#c06bff,#ff5a4f);animation:upd-spin 1.1s linear infinite;box-shadow:0 0 50px rgba(255,90,79,.55)}
.upd-ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#101216}

.upd-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a4f,#ffd34d,#3ddc97);animation:upd-fill 1.8s cubic-bezier(.4,0,.2,1) forwards}
@keyframes upd-spin{to{transform:rotate(360deg)}}
@keyframes upd-pulse{50%{scale:1.18}}

@media(prefers-reduced-motion:reduce){.upd-ring,.upd-ico,.upd-bar i{animation-duration:.01s;animation-iteration-count:1}.upd-toast{transition:none}}

#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 38%,var(--pr2),var(--bg) 62%);transition:opacity .6s ease,transform .6s ease,visibility .6s}

.sp-logo::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--pr),#ffd34d,var(--pr),transparent 70%);animation:sp-spin 1.6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.sp-logo::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid var(--pr);opacity:0;animation:sp-ping 1.8s ease-out infinite}
.sp-flag{width:84px;height:84px;border-radius:22px;background:#da251d;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 36px rgba(218,37,29,.45);animation:sp-pop .9s cubic-bezier(.2,1.5,.4,1) both}
.sp-flag i{width:50px;height:50px;background:#ffde00;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:sp-star 2.4s ease-in-out infinite}
.sp-t{font-size:24px;font-weight:800;color:var(--pr);letter-spacing:.5px;text-align:center;padding:0 16px}
.sp-t span{display:inline-block;opacity:0;transform:translateY(14px);animation:sp-up .5s cubic-bezier(.2,1,.4,1) forwards;white-space:pre}
.sp-s{font-size:13px;color:var(--mu);letter-spacing:3px;text-transform:uppercase;margin-top:-10px;opacity:0;animation:sp-up .6s .9s forwards}
.sp-bar{width:min(240px,64vw);height:5px;border-radius:5px;background:var(--bd);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--pr),#ffd34d);animation:sp-fill 1.5s cubic-bezier(.5,0,.2,1) forwards}

@keyframes sp-ping{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.25);opacity:0}}

<header><h1>🇻🇳 Ôn tập Lịch sử Đảng</h1><span id="online" class="online" hidden title="Số người đang mở trang này"><i></i><b>1</b> đang ôn</span><button class="btn s" data-a="theme" aria-label="Đổi giao diện sáng/tối">🌓</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const D={"chapters":[{"id":1,"title":"Chương 1","sub":"Đảng ra đời, lãnh đạo đấu tranh giành chính quyền (1930–1945)","sections":[{"h":"I. Sơ đồ nội dung chương","items":["1. Đảng Cộng sản Việt Nam ra đời và Cương lĩnh chính trị đầu tiên (tháng 02/1930).","2. Đảng lãnh đạo đấu tranh giành chính quyền (1930–1945): cao trào 1930–1931; phong trào dân chủ 1936–1939; giải phóng dân tộc 1939–1945; Cách mạng Tháng Tám 1945.","3. Tính chất, ý nghĩa và kinh nghiệm của Cách mạng Tháng Tám năm 1945."]},{"h":"II. Tóm tắt kiến thức trọng tâm","items":[{"h":"1. Bối cảnh Việt Nam trước khi Đảng ra đời","items":["Cuối thế kỷ XIX – đầu thế kỷ XX, Việt Nam trở thành thuộc địa của thực dân Pháp; xã hội chịu tác động đồng thời của chế độ thuộc địa và tàn dư phong kiến.","Mâu thuẫn nổi bật, ngày càng gay gắt là mâu thuẫn giữa dân tộc Việt Nam với đế quốc xâm lược và tay sai. Bên cạnh đó còn có mâu thuẫn giữa nông dân với địa chủ phong kiến.","Các giai cấp, tầng lớp có vị trí và thái độ chính trị khác nhau: nông dân chiếm số đông; công nhân hình thành trong quá trình khai thác thuộc địa; tiểu tư sản và tư sản dân tộc có những bộ phận tham gia phong trào yêu nước.","Các phong trào yêu nước cuối thế kỷ XIX – đầu thế kỷ XX như Cần Vương, khởi nghĩa Yên Thế, phong trào Đông Du, Duy Tân và Việt Nam Quốc dân Đảng đều thể hiện tinh thần yêu nước, nhưng chưa đưa cách mạng đến thắng lợi. Yêu cầu lịch sử đặt ra là cần một đường lối và tổ chức lãnh đạo phù hợp."]},{"h":"2. Nguyễn Ái Quốc chuẩn bị các điều kiện thành lập Đảng","items":["Ngày 05-06-1911, Nguyễn Tất Thành (sau này là Nguyễn Ái Quốc) ra đi tìm đường cứu nước.","Tháng 07/1920, Người tiếp cận bản Sơ thảo lần thứ nhất những luận cương về vấn đề dân tộc và vấn đề thuộc địa của V.I. Lênin; từ đó xác định con đường giải phóng dân tộc theo khuynh hướng cách mạng vô sản.","Từ 25-12-1920 đến 30-12-1920, tại Đại hội XVIII của Đảng Xã hội Pháp ở Tours, Nguyễn Ái Quốc bỏ phiếu tán thành Quốc tế III và tham gia sáng lập Đảng Cộng sản Pháp.","Năm 1925, Hội Việt Nam Cách mạng Thanh niên được thành lập ở Quảng Châu, góp phần truyền bá chủ nghĩa Mác – Lênin, đào tạo cán bộ và chuẩn bị về tổ chức cho sự ra đời của Đảng.","Phong trào “vô sản hóa” được tiến hành từ cuối năm 1928, góp phần truyền bá lý luận cách mạng vào phong trào công nhân.","Năm 1929, phong trào cách mạng phát triển dẫn đến sự ra đời của các tổ chức cộng sản. Yêu cầu thống nhất các tổ chức cộng sản trở nên cấp thiết."]},{"h":"3. Hội nghị thành lập Đảng và Cương lĩnh chính trị đầu tiên","items":["Cuối năm 1929, Nguyễn Ái Quốc với tư cách đại diện Quốc tế Cộng sản triệu tập, chủ trì hội nghị hợp nhất các tổ chức cộng sản tại Cửu Long (Hồng Kông).","Hội nghị diễn ra từ ngày 06-01-1930 đến ngày 07-02-1930; ngày 03-02-1930 được lấy làm ngày kỷ niệm thành lập Đảng.","Các văn kiện được thông qua gồm Chánh cương vắn tắt, Sách lược vắn tắt, Chương trình tóm tắt và Điều lệ vắn tắt của Đảng. Chánh cương vắn tắt và Sách lược vắn tắt hợp thành Cương lĩnh chính trị đầu tiên.","Mục tiêu chiến lược: làm cho Việt Nam hoàn toàn độc lập; xây dựng xã hội cộng sản.","Nhiệm vụ trước hết: đánh đổ đế quốc Pháp và phong kiến, làm cho nước Nam hoàn toàn độc lập. Cương lĩnh thể hiện việc đặt nhiệm vụ giải phóng dân tộc lên hàng đầu.","Lực lượng cách mạng gồm công nhân, nông dân là nền tảng; đồng thời chủ trương tập hợp, tranh thủ các tầng lớp và lực lượng có thể tham gia chống đế quốc, chống phong kiến.","Đảng giữ vai trò lãnh đạo; cách mạng Việt Nam là một bộ phận của cách mạng thế giới."]},{"h":"4. Phong trào cách mạng 1930–1931 và Luận cương chính trị tháng 10/1930","items":["Cuộc khủng hoảng kinh tế thế giới 1929–1933 và chính sách đàn áp của thực dân Pháp làm đời sống nhân dân khó khăn, thúc đẩy phong trào đấu tranh.","Từ tháng 05/1930, phong trào phát triển thành cao trào; ngày 01-05-1930, công nhân và nhân dân tổ chức nhiều cuộc đấu tranh. Ở Nghệ An và Hà Tĩnh, phong trào lên cao, hình thành các Xô viết ở một số địa phương.","Phong trào thể hiện vai trò lãnh đạo của Đảng, liên minh công – nông và sức mạnh quần chúng; đồng thời cung cấp kinh nghiệm về tổ chức lực lượng, xây dựng chính quyền cách mạng và đấu tranh chống đàn áp.","Luận cương chính trị tháng 10/1930 do Trần Phú khởi thảo, xác định tính chất cách mạng Đông Dương và nhấn mạnh vai trò của công nhân, nông dân, đấu tranh giai cấp và cách mạng ruộng đất."]},{"h":"5. Phong trào dân chủ 1936–1939","items":["Bối cảnh quốc tế: chủ nghĩa phát xít xuất hiện, nguy cơ chiến tranh; Đại hội VII Quốc tế Cộng sản (1935) đề ra chủ trương thành lập mặt trận nhân dân chống phát xít.","Ở Pháp, Mặt trận Nhân dân lên cầm quyền năm 1936, tạo điều kiện để phong trào đấu tranh dân chủ ở Đông Dương phát triển.","Chủ trương trước mắt: đấu tranh chống phản động thuộc địa, chống phát xít, chống chiến tranh; đòi tự do, dân chủ, cơm áo và hòa bình.","Hình thức đấu tranh linh hoạt, công khai và nửa công khai, hợp pháp và nửa hợp pháp; lực lượng tập hợp rộng rãi hơn, bao gồm nhiều tầng lớp nhân dân.","Ý nghĩa: phát triển lực lượng chính trị, nâng cao nhận thức và kinh nghiệm tổ chức quần chúng, chuẩn bị cho giai đoạn đấu tranh tiếp theo."]},{"h":"6. Phong trào giải phóng dân tộc 1939–1945","items":["Ngày 01-09-1939, Chiến tranh thế giới thứ hai bùng nổ. Chính sách cai trị và bóc lột của Pháp, sau đó là sự hiện diện của Nhật, làm mâu thuẫn dân tộc thêm gay gắt.","Hội nghị Trung ương 6 (06-11-1939 – 08-11-1939) mở đầu sự chuyển hướng chỉ đạo chiến lược, đặt nhiệm vụ giải phóng dân tộc lên hàng đầu.","Khởi nghĩa Bắc Sơn diễn ra ngày 27-09-1940; khởi nghĩa Nam Kỳ nổ ra ngày 23-11-1940; binh biến Đô Lương diễn ra tháng 01/1941. Các cuộc đấu tranh để lại kinh nghiệm về khởi nghĩa vũ trang.","Hội nghị Trung ương 8 (10-05-1941 – 19-05-1941) do Nguyễn Ái Quốc chủ trì tại Pác Bó, Cao Bằng, hoàn chỉnh chủ trương chuyển hướng chiến lược; nhấn mạnh giải phóng dân tộc là nhiệm vụ bức thiết nhất và chuẩn bị khởi nghĩa vũ trang.","Mặt trận Việt Minh được thành lập ngày 19-05-1941, tập hợp lực lượng yêu nước thông qua các hội cứu quốc.","Ngày 22-12-1944, Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập tại Cao Bằng, ban đầu có 34 chiến sĩ.","Ngày 09-03-1945, Nhật đảo chính Pháp. Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta” ngày 12-03-1945 xác định kẻ thù chính, phát động cao trào kháng Nhật cứu nước và thúc đẩy chuẩn bị tổng khởi nghĩa.","Trong cao trào kháng Nhật cứu nước, hình thức đấu tranh đa dạng theo từng địa bàn; các đội du kích, căn cứ địa và lực lượng chính trị được củng cố. Hội nghị quân sự cách mạng Bắc Kỳ diễn ra từ 15-04-1945 đến 20-04-1945.","Hội nghị toàn quốc của Đảng họp tại Tân Trào từ ngày 13 đến 15-08-1945, quyết định phát động tổng khởi nghĩa. Quốc dân Đại hội Tân Trào tán thành chủ trương tổng khởi nghĩa và thành lập Ủy ban Dân tộc Giải phóng Việt Nam do Hồ Chí Minh làm Chủ tịch."]},{"h":"7. Cách mạng Tháng Tám năm 1945","items":["Thời cơ: Nhật đầu hàng Đồng minh tháng 08/1945; bộ máy thống trị của Nhật ở Đông Dương hoang mang, trong khi lực lượng cách mạng đã được chuẩn bị qua nhiều năm.","Tổng khởi nghĩa giành chính quyền diễn ra nhanh chóng ở nhiều địa phương; Hà Nội giành chính quyền ngày 19-08, Huế ngày 23-08, Sài Gòn ngày 25-08-1945.","Ngày 02-09-1945, tại Hà Nội, Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa.","Tính chất: cách mạng giải phóng dân tộc, có tính chất dân chủ mới; là cuộc nổi dậy của toàn dân dưới sự lãnh đạo của Đảng.","Ý nghĩa: chấm dứt chế độ thuộc địa và phong kiến ở Việt Nam, mở ra kỷ nguyên độc lập dân tộc gắn với con đường xã hội chủ nghĩa; cổ vũ phong trào giải phóng dân tộc trên thế giới.","Kinh nghiệm được nhấn mạnh trong tài liệu: giương cao ngọn cờ giải phóng dân tộc; xây dựng lực lượng chính trị và vũ trang; kết hợp đấu tranh chính trị với vũ trang; xây dựng Đảng tiên phong, gắn bó với nhân dân; chủ động nắm bắt thời cơ."]}]}],"timeline":[["05-06-1911","Nguyễn Tất Thành (Nguyễn Ái Quốc) ra đi tìm đường cứu nước."],["tháng 07/1920","Nguyễn Ái Quốc tiếp cận Luận cương của V.I. Lênin về dân tộc và thuộc địa."],["25-12-1920 – 30-12-1920","Đại hội Tours; Nguyễn Ái Quốc tán thành Quốc tế III."],["21-06-1925","Thành lập Hội Việt Nam Cách mạng Thanh niên ở Quảng Châu (cùng ngày ra số đầu báo Thanh niên)."],["Cuối 1928 – đầu 1929","Phong trào “vô sản hóa”."],["1929","Các tổ chức cộng sản lần lượt ra đời; yêu cầu hợp nhất đặt ra cấp thiết."],["03-02-1930","Ngày kỷ niệm thành lập Đảng Cộng sản Việt Nam."],["01-05-1930","Phong trào đấu tranh của công nhân và nhân dân nhân Ngày Quốc tế Lao động."],["14-10-1930 – 31-10-1930","Hội nghị Trung ương lần thứ nhất (Hồng Kông) thông qua Luận cương chính trị do Trần Phú khởi thảo."],["1930–1931","Cao trào cách mạng; đỉnh cao Xô viết Nghệ – Tĩnh."],["25-07-1935 – 20-08-1935","Đại hội VII Quốc tế Cộng sản."],["1936–1939","Phong trào dân chủ."],["01-09-1939","Chiến tranh thế giới thứ hai bùng nổ."],["06-11-1939 – 08-11-1939","Hội nghị Trung ương 6; chuyển hướng chỉ đạo chiến lược."],["27-09-1940","Khởi nghĩa Bắc Sơn."],["23-11-1940","Khởi nghĩa Nam Kỳ."],["10-05-1941 – 19-05-1941","Hội nghị Trung ương 8 tại Pác Bó; hoàn chỉnh chuyển hướng chiến lược."],["19-05-1941","Thành lập Mặt trận Việt Minh."],["22-12-1944","Thành lập Đội Việt Nam Tuyên truyền Giải phóng quân."],["09-03-1945","Nhật đảo chính Pháp ở Đông Dương."],["12-03-1945","Ban hành Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta”."],["15-04-1945 – 20-04-1945","Hội nghị quân sự cách mạng Bắc Kỳ."],["13-08-1945 – 15-08-1945","Hội nghị toàn quốc của Đảng tại Tân Trào."],["19-08-1945","Hà Nội giành chính quyền."],["23-08-1945","Huế giành chính quyền."],["25-08-1945","Sài Gòn giành chính quyền."],["02-09-1945","Tuyên ngôn Độc lập; thành lập nước Việt Nam Dân chủ Cộng hòa."]],"confuse":["**Hội nghị Trung ương 6 và Hội nghị Trung ương 8:** Hội nghị Trung ương 6 (06-11-1939 – 08-11-1939) mở đầu chuyển hướng chiến lược; Hội nghị Trung ương 8 (10-05-1941 – 19-05-1941) hoàn chỉnh chuyển hướng, nhấn mạnh giải phóng dân tộc và chuẩn bị khởi nghĩa vũ trang.","**Cương lĩnh chính trị đầu tiên và Luận cương tháng 10/1930:** Cương lĩnh đầu tiên đặt nhiệm vụ giải phóng dân tộc nổi bật, chủ trương tập hợp lực lượng rộng. Luận cương nhấn mạnh đấu tranh giai cấp, công – nông và cách mạng ruộng đất.","**Phong trào 1930–1931 và phong trào 1936–1939:** 1930–1931: cao trào cách mạng, đấu tranh quyết liệt, đỉnh cao Xô viết Nghệ – Tĩnh. 1936–1939: mục tiêu trước mắt là dân sinh, dân chủ, hòa bình; hình thức hợp pháp, nửa hợp pháp và tập hợp lực lượng rộng.","**Chỉ thị tháng 03/1945 và quyết định Tổng khởi nghĩa tháng 08/1945:** Chỉ thị 12-03-1945 phát động cao trào kháng Nhật cứu nước sau cuộc đảo chính Nhật–Pháp; quyết định tổng khởi nghĩa được đưa ra khi thời cơ tháng 08/1945 chín muồi.","**Việt Minh và Đội Việt Nam Tuyên truyền Giải phóng quân:** Việt Minh là mặt trận đoàn kết dân tộc thành lập năm 1941; Đội Việt Nam Tuyên truyền Giải phóng quân là lực lượng vũ trang thành lập ngày 22-12-1944."],"check":["Tôi phân biệt được Cương lĩnh chính trị đầu tiên với Luận cương chính trị tháng 10/1930.","Tôi nhớ các mốc: 03-02-1930; 06-11-1939 – 08-11-1939; 27-09-1940; 23-11-1940; 10-05-1941 – 19-05-1941; 19-05-1941; 22-12-1944; 09-03-1945; 12-03-1945; 13-08-1945 – 15-08-1945; 02-09-1945.","Tôi phân biệt được phong trào 1930–1931, 1936–1939 và 1939–1945.","Tôi giải thích được vai trò của Hội nghị Trung ương 8, Mặt trận Việt Minh và cao trào kháng Nhật cứu nước.","Tôi nêu được tính chất, ý nghĩa và các kinh nghiệm chính của Cách mạng Tháng Tám."],"mcq":[{"q":"Sự kiện nào đánh dấu Nguyễn Ái Quốc xác định con đường giải phóng dân tộc theo khuynh hướng cách mạng vô sản?","o":["Ra đi tìm đường cứu nước ngày 05-06-1911","Đọc Luận cương của V.I. Lênin tháng 07/1920","Thành lập Hội Việt Nam Cách mạng Thanh niên năm 1925","Về nước năm 1941"],"a":1,"e":"Tài liệu nêu tháng 07/1920 Người đọc bản Luận cương của V.I. Lênin và tìm thấy hướng đi cho cách mạng Việt Nam."},{"q":"Tổ chức nào được thành lập ở Quảng Châu năm 1925 để chuẩn bị về tư tưởng, chính trị và tổ chức cho sự ra đời của Đảng?","o":["Việt Minh","Việt Nam Quốc dân Đảng","Hội Việt Nam Cách mạng Thanh niên","Đông Dương Cộng sản Liên đoàn"],"a":2,"e":"Hội Việt Nam Cách mạng Thanh niên được thành lập tháng 06/1925."},{"q":"Ngày kỷ niệm thành lập Đảng Cộng sản Việt Nam là ngày nào?","o":["06-01-1930","03-02-1930","07-02-1930","24-02-1930"],"a":1,"e":"Hội nghị hợp nhất diễn ra từ 06-01-1930 đến 07-02-1930; ngày 03-02 được lấy làm ngày kỷ niệm thành lập Đảng."},{"q":"Hai văn kiện nào hợp thành Cương lĩnh chính trị đầu tiên?","o":["Luận cương chính trị và Điều lệ Đảng","Chánh cương vắn tắt và Sách lược vắn tắt","Chương trình hành động và Luận cương","Chỉ thị Nhật–Pháp và Tuyên ngôn Độc lập"],"a":1,"e":"Theo tài liệu, Chánh cương vắn tắt và Sách lược vắn tắt là hai văn kiện cốt lõi của Cương lĩnh đầu tiên."},{"q":"Phong trào cách mạng 1930–1931 đạt đỉnh cao ở đâu?","o":["Bắc Sơn","Nam Kỳ","Xô viết Nghệ – Tĩnh","Tân Trào"],"a":2,"e":"Phong trào ở Nghệ An và Hà Tĩnh phát triển mạnh, hình thành các Xô viết tại một số địa phương."},{"q":"Luận cương chính trị tháng 10/1930 do ai khởi thảo?","o":["Nguyễn Ái Quốc","Trần Phú","Lê Hồng Phong","Hà Huy Tập"],"a":1,"e":"Tài liệu ghi Luận cương chính trị tháng 10/1930 do Trần Phú khởi thảo."},{"q":"Mục tiêu trước mắt của phong trào dân chủ 1936–1939 là gì?","o":["Tổng khởi nghĩa giành chính quyền ngay","Đòi ruộng đất triệt để cho nông dân","Đòi tự do, dân chủ, cơm áo và hòa bình","Thành lập chính quyền Xô viết"],"a":2,"e":"Phong trào tập trung vào các yêu sách dân sinh, dân chủ, chống phát xít và chiến tranh."},{"q":"Hội nghị Trung ương 6 diễn ra vào thời gian nào?","o":["tháng 10/1930","tháng 11/1939","tháng 05/1941","tháng 03/1945"],"a":1,"e":"Hội nghị Trung ương 6 tháng 11/1939 mở đầu chuyển hướng chỉ đạo chiến lược."},{"q":"Khởi nghĩa Bắc Sơn diễn ra ngày nào?","o":["27-09-1940","23-11-1940","09-03-1945","19-05-1941"],"a":0,"e":"Mốc được nêu trong tài liệu là ngày 27-09-1940."},{"q":"Hội nghị Trung ương 8 tháng 05/1941 họp ở đâu?","o":["Tân Trào, Tuyên Quang","Pác Bó, Cao Bằng","Hồng Kông","Quảng Châu"],"a":1,"e":"Hội nghị do Nguyễn Ái Quốc chủ trì tại Pác Bó, Cao Bằng."},{"q":"Mặt trận Việt Minh được thành lập ngày nào?","o":["19-05-1941","22-12-1944","12-03-1945","13-08-1945"],"a":0,"e":"Ngày 19-05-1941 là mốc thành lập Mặt trận Việt Minh."},{"q":"Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập ngày nào?","o":["19-05-1941","22-12-1944","09-03-1945","02-09-1945"],"a":1,"e":"Đội được thành lập ngày 22-12-1944 tại Cao Bằng, ban đầu gồm 34 chiến sĩ."},{"q":"Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta” ra đời ngày nào?","o":["09-03-1945","12-03-1945","16-04-1945","15-05-1945"],"a":1,"e":"Nhật đảo chính Pháp ngày 09-03; Đảng ban hành chỉ thị ngày 12-03-1945."},{"q":"Hội nghị toàn quốc của Đảng tháng 08/1945 họp ở đâu?","o":["Pác Bó","Hồng Kông","Tân Trào","Hà Nội"],"a":2,"e":"Hội nghị diễn ra tại Tân Trào từ ngày 13 đến 15-08-1945."},{"q":"Ngày Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập là ngày nào?","o":["19-08-1945","23-08-1945","25-08-1945","02-09-1945"],"a":3,"e":"Tuyên ngôn Độc lập được đọc tại Hà Nội ngày 02-09-1945."}]},{"id":2,"title":"Chương 2","sub":"Xây dựng, bảo vệ chính quyền và kháng chiến chống thực dân Pháp (1945–1954)","sections":[{"h":"I. Khái quát chương","items":["Sau Cách mạng Tháng Tám năm 1945, nước Việt Nam Dân chủ Cộng hòa đứng trước tình thế đặc biệt khó khăn: chính quyền cách mạng còn non trẻ, kinh tế kiệt quệ, nạn đói và nạn mù chữ nghiêm trọng, ngân khố trống rỗng; các thế lực thù địch đe dọa từ nhiều phía.","Đảng lãnh đạo nhân dân vừa xây dựng, củng cố chính quyền cách mạng, vừa đấu tranh chống các thế lực chống phá và tìm cách tránh tình thế phải đối đầu cùng lúc với nhiều kẻ thù.","Khi thực dân Pháp mở rộng chiến tranh xâm lược, Đảng phát động và lãnh đạo toàn dân kháng chiến; từng bước xây dựng lực lượng, phát triển chiến tranh nhân dân, giành thắng lợi quyết định ở Điện Biên Phủ năm 1954."]},{"h":"II. Tóm tắt kiến thức trọng tâm","items":[{"h":"1. Tình hình Việt Nam sau Cách mạng Tháng Tám","items":["Thuận lợi: nhân dân giành được độc lập, có chính quyền cách mạng; Đảng và Chủ tịch Hồ Chí Minh có uy tín; nhân dân có tinh thần yêu nước và quyết tâm bảo vệ thành quả cách mạng.","Khó khăn: nạn đói, nạn dốt, tài chính khó khăn; nền độc lập chưa được quốc tế công nhận rộng rãi; quân đội nước ngoài vào giải giáp quân Nhật; thực dân Pháp âm mưu quay lại xâm lược.","Chủ trương chung: củng cố chính quyền, chống giặc đói, giặc dốt và giặc ngoại xâm; tranh thủ thời gian hòa hoãn cần thiết, phân hóa đối phương, chuẩn bị lực lượng cho cuộc đấu tranh lâu dài nếu chiến tranh không thể tránh khỏi."]},{"h":"2. Xây dựng và bảo vệ chính quyền cách mạng (1945–1946)","items":["Ngày 25-11-1945, Ban Chấp hành Trung ương ban hành Chỉ thị Kháng chiến kiến quốc. Nhiệm vụ trung tâm là củng cố chính quyền, chống thực dân Pháp xâm lược, bài trừ nội phản, cải thiện đời sống nhân dân.","Đẩy mạnh tăng gia sản xuất, cứu đói, tổ chức quyên góp và phát động các phong trào tương trợ; mở phong trào bình dân học vụ để chống nạn mù chữ.","Ngày 06-01-1946, tổng tuyển cử bầu Quốc hội khóa I; đây là bước quan trọng xây dựng cơ sở pháp lý và tính chính danh của nhà nước mới.","Ngày 02-03-1946, Quốc hội họp kỳ đầu tiên, thành lập Chính phủ chính thức. Hiến pháp đầu tiên được Quốc hội thông qua ngày 09-11-1946.","Ở miền Bắc, quân Tưởng và các tổ chức tay sai gây sức ép; ở miền Nam, thực dân Pháp mở rộng chiến tranh. Đảng chủ trương mềm dẻo về sách lược, tranh thủ hòa hoãn để tránh phải cùng lúc đối phó nhiều kẻ thù.","Hiệp định Sơ bộ Việt–Pháp được ký ngày 06-03-1946; Tạm ước Việt–Pháp được ký ngày 14-09-1946. Đây là các biện pháp ngoại giao nhằm kéo dài thời gian hòa bình, củng cố lực lượng và tiếp tục đấu tranh bảo vệ nền độc lập."]},{"h":"3. Đường lối toàn quốc kháng chiến","items":["Trước hành động mở rộng chiến tranh của thực dân Pháp và nguy cơ không thể tiếp tục hòa hoãn, Đảng xác định phải tiến hành kháng chiến để bảo vệ độc lập dân tộc.","Ngày 12-12-1946, Ban Thường vụ Trung ương Đảng ra Chỉ thị Toàn dân kháng chiến (một số tài liệu ghi 22-12-1946 là ngày công bố; khi thi, bám đúng mốc trong giáo trình của giảng viên). Ngày 18-12-1946 – 19-12-1946, Hội nghị Ban Thường vụ Trung ương Đảng (mở rộng) tại Vạn Phúc quyết định phát động toàn quốc kháng chiến.","Lời kêu gọi Toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh đề ngày 19-12-1946 (phát trên Đài Tiếng nói Việt Nam sáng 20-12-1946). 20 giờ ngày 19-12-1946, quân dân Hà Nội nổ súng, mở đầu cuộc kháng chiến toàn quốc.","Đường lối kháng chiến: toàn dân, toàn diện, trường kỳ, dựa vào sức mình là chính; đồng thời tranh thủ sự đồng tình và ủng hộ quốc tế.","Toàn dân: huy động sức mạnh của mọi tầng lớp nhân dân. Toàn diện: đấu tranh trên các mặt trận quân sự, chính trị, kinh tế, văn hóa và ngoại giao. Trường kỳ: xác định cuộc chiến đấu lâu dài. Dựa vào sức mình là chính: phát huy nội lực dân tộc, không ỷ lại vào bên ngoài."]},{"h":"4. Những năm đầu kháng chiến (1946–1950)","items":["Ở các đô thị phía Bắc vĩ tuyến 16, quân dân ta chiến đấu giam chân địch, tạo điều kiện để cơ quan đầu não và lực lượng chủ lực rút lui, bảo toàn lực lượng.","Chiến dịch Việt Bắc Thu–Đông năm 1947 đánh bại cuộc tiến công lớn của Pháp lên căn cứ địa Việt Bắc, bảo vệ cơ quan lãnh đạo kháng chiến và làm phá sản ý đồ kết thúc chiến tranh nhanh chóng của địch.","Từ năm 1948, tình hình quốc tế có chuyển biến; lực lượng kháng chiến từng bước trưởng thành, xây dựng căn cứ, phát triển lực lượng vũ trang và đẩy mạnh chiến tranh du kích.","Chiến dịch Biên giới Thu–Đông năm 1950 giành thắng lợi quan trọng, khai thông biên giới Việt–Trung, mở rộng căn cứ địa Việt Bắc, tạo điều kiện để ta giành quyền chủ động hơn trên chiến trường chính Bắc Bộ.","Thắng lợi năm 1950 đánh dấu bước phát triển của cuộc kháng chiến: lực lượng chủ lực tiến bộ, hậu phương được củng cố và khả năng nhận viện trợ quốc tế được cải thiện."]},{"h":"5. Phát triển kháng chiến và chiến cuộc Đông–Xuân 1953–1954","items":["Trong các năm 1951–1953, Đảng tiếp tục xây dựng Đảng, củng cố hậu phương, phát triển lực lượng vũ trang và đẩy mạnh đấu tranh trên các chiến trường.","Đại hội đại biểu toàn quốc lần thứ II của Đảng họp từ 11-02-1951 đến 19-02-1951 tại Chiêm Hóa, Tuyên Quang. Đảng hoạt động công khai với tên Đảng Lao động Việt Nam.","Trước kế hoạch Nava của Pháp, quân dân ta chủ động mở các cuộc tiến công chiến lược Đông–Xuân 1953–1954, buộc địch phân tán lực lượng ra nhiều hướng.","Điện Biên Phủ được Pháp xây dựng thành tập đoàn cứ điểm mạnh. Bộ Chính trị quyết định mở chiến dịch Điện Biên Phủ; chiến dịch diễn ra từ ngày 13-03-1954 đến 07-05-1954 và kết thúc bằng thắng lợi quyết định.","Thắng lợi Điện Biên Phủ làm phá sản nỗ lực quân sự lớn của Pháp, tạo điều kiện quyết định cho việc ký Hiệp định Genève năm 1954 về Đông Dương."]},{"h":"6. Ý nghĩa và kinh nghiệm","items":["Ý nghĩa: bảo vệ được chính quyền cách mạng trong buổi đầu đầy thử thách; giữ vững độc lập, phát triển lực lượng kháng chiến; đánh bại các bước leo thang quan trọng của Pháp và kết thúc thắng lợi cuộc kháng chiến chống thực dân Pháp.","Kinh nghiệm: phát huy sức mạnh đại đoàn kết toàn dân; kết hợp kháng chiến với kiến quốc; xây dựng đường lối đúng đắn, độc lập tự chủ; kết hợp đấu tranh quân sự, chính trị, ngoại giao; xây dựng hậu phương và lực lượng vũ trang; biết tranh thủ thời cơ và sự ủng hộ quốc tế."]}]}],"timeline":[["25-11-1945","Ban hành Chỉ thị Kháng chiến kiến quốc."],["06-01-1946","Tổng tuyển cử bầu Quốc hội khóa I."],["02-03-1946","Kỳ họp đầu tiên của Quốc hội khóa I."],["06-03-1946","Ký Hiệp định Sơ bộ Việt–Pháp."],["14-09-1946","Ký Tạm ước Việt–Pháp."],["09-11-1946","Quốc hội thông qua Hiến pháp đầu tiên."],["12-12-1946","Ban hành Chỉ thị Toàn dân kháng chiến (một số tài liệu ghi 22-12-1946)."],["18-12-1946 – 19-12-1946","Quyết định và phát động Toàn quốc kháng chiến."],["19-12-1946","Toàn quốc kháng chiến bùng nổ (20 giờ, Hà Nội nổ súng); Lời kêu gọi đề ngày 19-12."],["07-10-1947 – 19-12-1947","Chiến dịch Việt Bắc Thu–Đông 1947; đánh bại cuộc tiến công lớn của Pháp."],["16-09-1950 – 14-10-1950","Chiến dịch Biên giới Thu–Đông 1950; khai thông biên giới Việt–Trung."],["11-02-1951 – 19-02-1951","Đại hội II; Đảng hoạt động công khai với tên Đảng Lao động Việt Nam."],["13-03-1954 – 07-05-1954","Chiến dịch Điện Biên Phủ."],["07-05-1954","Chiến thắng Điện Biên Phủ."],["21-07-1954","Ký kết các văn kiện Hiệp định Genève về Đông Dương."]],"confuse":["**Chỉ thị Kháng chiến kiến quốc (25-11-1945):** Chủ trương giải quyết tình thế sau Cách mạng Tháng Tám, xây dựng chính quyền và bảo vệ thành quả cách mạng.","**Hiệp định Sơ bộ (06-03-1946) và Tạm ước (14-09-1946):** Hai văn kiện ngoại giao khác nhau, đều nhằm tranh thủ thời gian hòa hoãn và củng cố lực lượng; không đồng nghĩa từ bỏ mục tiêu độc lập.","**Việt Bắc 1947 và Biên giới 1950:** Việt Bắc: đánh bại cuộc tiến công của Pháp lên căn cứ địa. Biên giới: khai thông biên giới Việt–Trung, tạo bước chuyển về quyền chủ động.","**Điện Biên Phủ và Hiệp định Genève:** Điện Biên Phủ là thắng lợi quân sự ngày 07-05-1954; Hiệp định Genève là kết quả ngoại giao được ký tháng 07/1954."],"check":["Nhớ các mốc: 25-11-1945; 06-01-1946; 06-03-1946; 14-09-1946; 12-12-1946; 19-12-1946; 1947; 1950; 11-02-1951 – 19-02-1951; 13-03-1954 – 07-05-1954; 21-07-1954.","Phân biệt Chỉ thị Kháng chiến kiến quốc với Chỉ thị Toàn dân kháng chiến.","Trình bày được bốn nội dung của đường lối kháng chiến.","Phân biệt ý nghĩa của chiến dịch Việt Bắc 1947, Biên giới 1950 và Điện Biên Phủ 1954.","Nêu được ý nghĩa của thắng lợi kháng chiến chống Pháp và vai trò của hậu phương, đoàn kết toàn dân."],"mcq":[{"q":"Khó khăn nào là một trong những thách thức cấp bách của Việt Nam sau Cách mạng Tháng Tám?","o":["Chính quyền cách mạng đã ổn định hoàn toàn","Nạn đói, nạn dốt và nguy cơ ngoại xâm","Không có lực lượng thù địch","Kinh tế phát triển mạnh"],"a":1,"e":"Nhà nước mới phải đối mặt đồng thời với khủng hoảng kinh tế-xã hội và các thế lực chống phá."},{"q":"Chỉ thị Kháng chiến kiến quốc được ban hành ngày nào?","o":["02-09-1945","25-11-1945","06-01-1946","06-03-1946"],"a":1,"e":"Mốc cần nhớ là ngày 25-11-1945."},{"q":"Tổng tuyển cử bầu Quốc hội khóa I diễn ra ngày nào?","o":["06-01-1946","02-03-1946","06-03-1946","09-11-1946"],"a":0,"e":"Ngày 06-01-1946 là cuộc tổng tuyển cử đầu tiên."},{"q":"Hiệp định Sơ bộ Việt–Pháp được ký ngày nào?","o":["25-11-1945","06-01-1946","06-03-1946","14-09-1946"],"a":2,"e":"Hiệp định Sơ bộ ký ngày 06-03-1946."},{"q":"Tạm ước Việt–Pháp được ký vào ngày nào?","o":["06-03-1946","14-09-1946","09-11-1946","19-12-1946"],"a":1,"e":"Tạm ước được ký ngày 14-09-1946."},{"q":"Đường lối kháng chiến chống Pháp gồm những nội dung cốt lõi nào?","o":["Đánh nhanh thắng nhanh, dựa hoàn toàn vào viện trợ","Toàn dân, toàn diện, trường kỳ, dựa vào sức mình là chính","Chỉ đấu tranh quân sự","Chỉ đấu tranh ngoại giao"],"a":1,"e":"Đây là bốn nội dung cốt lõi của đường lối kháng chiến."},{"q":"Chỉ thị Toàn dân kháng chiến được ban hành ngày nào?","o":["25-11-1945","12-12-1946","19-12-1946","07-05-1954"],"a":1,"e":"Ban Thường vụ Trung ương Đảng ra Chỉ thị Toàn dân kháng chiến ngày 12-12-1946 (một số tài liệu ghi 22-12-1946 là ngày công bố)."},{"q":"Toàn quốc kháng chiến bùng nổ vào ngày nào?","o":["06-03-1946","14-09-1946","19-12-1946","19-12-1947"],"a":2,"e":"Ngày 19-12-1946 đánh dấu cuộc kháng chiến toàn quốc bùng nổ."},{"q":"Chiến dịch Việt Bắc Thu–Đông diễn ra năm nào?","o":["1946","1947","1950","1954"],"a":1,"e":"Chiến dịch Việt Bắc Thu–Đông năm 1947 đánh bại cuộc tiến công của Pháp lên căn cứ địa."},{"q":"Ý nghĩa nổi bật của chiến dịch Biên giới Thu–Đông 1950 là gì?","o":["Kết thúc ngay chiến tranh","Khai thông biên giới Việt–Trung và tạo chuyển biến chiến lược","Giải phóng hoàn toàn miền Nam","Thành lập Mặt trận Việt Minh"],"a":1,"e":"Chiến dịch giúp khai thông biên giới và tạo điều kiện để ta giành quyền chủ động hơn."},{"q":"Đại hội đại biểu toàn quốc lần thứ II của Đảng diễn ra năm nào?","o":["1935","1941","1951","1954"],"a":2,"e":"Đại hội II diễn ra tháng 02/1951."},{"q":"Tại Đại hội II, Đảng hoạt động công khai với tên gọi nào?","o":["Đảng Cộng sản Đông Dương","Đảng Lao động Việt Nam","Đảng Dân chủ Việt Nam","Việt Nam Quốc dân Đảng"],"a":1,"e":"Đảng hoạt động công khai với tên Đảng Lao động Việt Nam."},{"q":"Chiến dịch Điện Biên Phủ diễn ra trong khoảng thời gian nào?","o":["1947","1950","13-03-1954 – 07-05-1954","21-07-1954 – 02-09-1954"],"a":2,"e":"Chiến dịch kéo dài từ 13-03-1954 đến 07-05-1954."},{"q":"Ngày chiến thắng Điện Biên Phủ là ngày nào?","o":["19-12-1946","07-05-1954","21-07-1954","02-09-1954"],"a":1,"e":"Chiến dịch kết thúc thắng lợi ngày 07-05-1954."},{"q":"Hiệp định Genève về Đông Dương được ký kết vào tháng nào năm 1954?","o":["Tháng 2","Tháng 5","Tháng 7","Tháng 12"],"a":2,"e":"Các văn kiện Hiệp định Genève được ký ngày 21-07-1954."}]},{"id":3,"title":"Chương 3","sub":"Quá độ lên CNXH và công cuộc Đổi mới (1975–2018)","sections":[{"h":"I. Bản đồ kiến thức","items":["1975–1986: Cả nước thống nhất, xây dựng chủ nghĩa xã hội; mô hình kế hoạch hóa tập trung bộc lộ hạn chế, đất nước lâm vào khủng hoảng kinh tế – xã hội.","Chuỗi Đại hội cần nhớ: Đại hội IV (1976) → V (1982) → VI (1986) → VII (1991) → VIII (1996) → IX (2001) → X (2006) → XI (2011) → XII (2016). Ngày tháng cụ thể của từng Đại hội xem các mục bên dưới và tab Mốc."]},{"h":"II. Giai đoạn 1975–1986: thống nhất đất nước và những tìm tòi đổi mới","items":[{"h":"1. Hoàn thành thống nhất đất nước về mặt nhà nước","items":["Ngày 25-04-1976: tổng tuyển cử bầu Quốc hội chung của cả nước.","Kỳ họp thứ nhất Quốc hội khóa VI (24-06-1976 – 03-07-1976): quyết định tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam; Quốc kỳ, Quốc huy, Quốc ca; Thủ đô Hà Nội; thành phố Sài Gòn đổi tên thành Thành phố Hồ Chí Minh.","Ý nghĩa: hoàn thành thống nhất đất nước về mặt nhà nước, tạo điều kiện để cả nước cùng thực hiện nhiệm vụ xây dựng và bảo vệ Tổ quốc."]},{"h":"2. Đại hội IV của Đảng (14-12-1976 – 20-12-1976)","items":["Diễn ra tại Hà Nội; là đại hội sau khi đất nước thống nhất.","Đề ra đường lối chung của cách mạng xã hội chủ nghĩa trong cả nước và phương hướng, nhiệm vụ kế hoạch 5 năm 1976–1980.","Đổi tên Đảng Lao động Việt Nam thành Đảng Cộng sản Việt Nam; đồng chí Lê Duẩn được bầu làm Tổng Bí thư.","Nhận diện khi làm trắc nghiệm: Đại hội IV gắn với việc xác lập đường lối xây dựng chủ nghĩa xã hội trên phạm vi cả nước; hạn chế là chủ quan, nóng vội, duy ý chí trong một số chủ trương và tổ chức thực hiện."]},{"h":"3. Đại hội V (27-03-1982 – 31-03-1982)","items":["Tiếp tục xác định hai nhiệm vụ chiến lược: xây dựng chủ nghĩa xã hội và bảo vệ Tổ quốc xã hội chủ nghĩa.","Nhấn mạnh nhiệm vụ trước mắt là ổn định và cải thiện đời sống nhân dân, đồng thời phát triển sản xuất, đặc biệt là nông nghiệp và hàng tiêu dùng.","Bối cảnh kinh tế – xã hội vẫn rất khó khăn; cơ chế quản lý tập trung quan liêu, bao cấp bộc lộ nhiều bất cập."]},{"h":"4. Những thử nghiệm, tìm tòi đổi mới trước năm 1986","items":["Thực tiễn cho thấy cần tháo gỡ ràng buộc trong quản lý, tạo động lực cho người lao động và cơ sở sản xuất.","Chỉ thị 100-CT/TW (13-01-1981) về khoán sản phẩm đến nhóm và người lao động trong hợp tác xã nông nghiệp.","Quyết định 25-CP và 26-CP (21-01-1981) tạo một số cơ chế chủ động hơn cho xí nghiệp quốc doanh và hoạt động thương nghiệp.","Các biện pháp trên là bước tìm tòi, chưa phải sự đổi mới toàn diện; chúng góp phần chuẩn bị thực tiễn cho Đại hội VI."]}]},{"h":"III. Đại hội VI (15-12-1986 – 18-12-1986): bước ngoặt đổi mới","items":["Đại hội VI họp tại Hà Nội từ ngày 15 đến 18-12-1986.","Bối cảnh: khủng hoảng kinh tế – xã hội nghiêm trọng, lạm phát cao, sản xuất trì trệ, đời sống nhân dân khó khăn.","Bài học chỉ đạo nổi bật: nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật; xuất phát từ thực tế, tôn trọng quy luật khách quan.","Đổi mới toàn diện, đồng bộ nhưng có trọng tâm; trước hết là đổi mới tư duy, đặc biệt tư duy kinh tế.","Đổi mới không có nghĩa là từ bỏ mục tiêu xã hội chủ nghĩa; là tìm cách thực hiện mục tiêu phù hợp quy luật và điều kiện thực tiễn.","Chính sách kinh tế nhiều thành phần được thừa nhận trong thời kỳ quá độ; chuyển dần từ cơ chế tập trung quan liêu, bao cấp sang cơ chế hạch toán, kinh doanh và vận hành theo quy luật thị trường có sự quản lý của Nhà nước.","Ý nghĩa: mở ra thời kỳ đổi mới đất nước, tạo chuyển biến trong nhận thức và đường lối phát triển."]},{"h":"IV. 1991–2018: phát triển và hoàn thiện đường lối đổi mới","items":["|| **Mốc / sự kiện** | **Nội dung cần nhớ** |","|| Đại hội VII (24-06-1991 – 27-06-1991) | Thông qua Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (Cương lĩnh 1991); thông qua Chiến lược ổn định và phát triển kinh tế – xã hội đến năm 2000. |","|| Hội nghị Trung ương 3 khóa VII – tháng 06/1992 | Đề cập đổi mới, chỉnh đốn Đảng và những vấn đề quan trọng trong xây dựng Đảng. |","|| Đại hội VIII (28-06-1996 – 01-07-1996) | Xác định đất nước chuyển sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa. |","|| Đại hội IX (19-04-2001 – 22-04-2001) | Xác định mô hình kinh tế tổng quát của Việt Nam trong thời kỳ quá độ là nền kinh tế thị trường định hướng xã hội chủ nghĩa. |","|| Đại hội X (18-04-2006 – 25-04-2006) | Tiếp tục đẩy mạnh toàn diện công cuộc đổi mới; chú trọng xây dựng, chỉnh đốn Đảng và phát huy sức mạnh đại đoàn kết toàn dân tộc. |","|| Đại hội XI (12-01-2011 – 19-01-2011) | Thông qua Cương lĩnh (bổ sung, phát triển năm 2011); thông qua Chiến lược phát triển kinh tế – xã hội 2011–2020. |","|| Đại hội XII (20-01-2016 – 28-01-2016) | Tổng kết 30 năm đổi mới; nhấn mạnh tiếp tục đổi mới toàn diện, đồng bộ, xây dựng Đảng trong sạch, vững mạnh, phát triển nhanh và bền vững. |","|| Đến năm 2018 | Đường lối đổi mới tiếp tục được triển khai; đẩy mạnh công nghiệp hóa, hiện đại hóa và hội nhập quốc tế, đồng thời nhìn nhận các hạn chế và thách thức phát triển. |"]},{"h":"V. Các nội dung lý luận dễ xuất hiện trong câu hỏi","items":["Kinh tế thị trường định hướng xã hội chủ nghĩa: vận hành theo các quy luật của kinh tế thị trường, có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa, dưới sự lãnh đạo của Đảng; hướng tới mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","Công nghiệp hóa, hiện đại hóa: quá trình chuyển đổi căn bản, toàn diện các hoạt động sản xuất, kinh doanh, dịch vụ và quản lý kinh tế – xã hội; sử dụng lao động, công nghệ, phương tiện và phương pháp tiên tiến, hiện đại.","Đổi mới và định hướng xã hội chủ nghĩa: đổi mới phương thức, cơ chế và chính sách để phát triển đất nước, không đồng nghĩa với thay đổi mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội.","Hội nhập quốc tế: chủ động mở rộng quan hệ đối ngoại, hợp tác và tham gia các cơ chế quốc tế; cần kết hợp nội lực với ngoại lực, giữ vững độc lập, chủ quyền và lợi ích quốc gia – dân tộc.","Thành tựu đổi mới thường được nhìn trên các mặt: tăng trưởng và chuyển dịch cơ cấu kinh tế; cải thiện đời sống; phát triển giáo dục, y tế, văn hóa; mở rộng quan hệ đối ngoại; giữ vững độc lập, chủ quyền. Đồng thời, giáo trình cũng nêu hạn chế như phát triển chưa bền vững, chất lượng tăng trưởng và năng suất còn hạn chế, tham nhũng/lãng phí và một số vấn đề xã hội."]}],"timeline":[["25-04-1976","Tổng tuyển cử bầu Quốc hội chung của cả nước."],["24-06-1976 – 03-07-1976","Kỳ họp thứ nhất Quốc hội khóa VI; thống nhất nhà nước."],["14-12-1976 – 20-12-1976","Đại hội IV."],["13-01-1981","Chỉ thị 100-CT/TW về khoán sản phẩm trong nông nghiệp."],["27-03-1982 – 31-03-1982","Đại hội V."],["15-12-1986 – 18-12-1986","Đại hội VI – khởi xướng đường lối đổi mới toàn diện."],["24-06-1991 – 27-06-1991","Đại hội VII; Cương lĩnh 1991."],["28-06-1996 – 01-07-1996","Đại hội VIII; đẩy mạnh công nghiệp hóa, hiện đại hóa."],["19-04-2001 – 22-04-2001","Đại hội IX; kinh tế thị trường định hướng xã hội chủ nghĩa."],["18-04-2006 – 25-04-2006","Đại hội X."],["12-01-2011 – 19-01-2011","Đại hội XI; Cương lĩnh bổ sung, phát triển năm 2011."],["20-01-2016 – 28-01-2016","Đại hội XII; tổng kết 30 năm đổi mới."]],"confuse":["Đại hội IV (1976): xây dựng chủ nghĩa xã hội trên phạm vi cả nước; Đại hội VI (1986): khởi xướng đường lối đổi mới.","Đại hội V (1982): tiếp tục xây dựng và bảo vệ Tổ quốc, nhấn mạnh nhiệm vụ trước mắt; không phải Đại hội khởi xướng đổi mới toàn diện.","Đại hội VII (1991): Cương lĩnh xây dựng đất nước trong thời kỳ quá độ; Đại hội XI (2011): Cương lĩnh được bổ sung, phát triển.","Đại hội VIII (1996): đẩy mạnh công nghiệp hóa, hiện đại hóa; Đại hội IX (2001): mô hình kinh tế tổng quát là kinh tế thị trường định hướng xã hội chủ nghĩa.","Chỉ thị 100-CT/TW năm 1981 là khoán sản phẩm trong nông nghiệp; không nhầm với đường lối đổi mới toàn diện tại Đại hội VI năm 1986.","Thống nhất đất nước về mặt nhà nước diễn ra năm 1976, sau thắng lợi giải phóng miền Nam năm 1975."],"check":["Nhớ đúng các mốc: 1976, 1981, 1982, 1986, 1991, 1996, 2001, 2006, 2011, 2016.","Phân biệt rõ vai trò của Đại hội IV, V, VI, VII, VIII, IX, XI, XII.","Thuộc Chỉ thị 100-CT/TW và ý nghĩa của các thử nghiệm đổi mới trước Đại hội VI.","Giải thích được vì sao Đại hội VI là bước ngoặt và “đổi mới” không đồng nghĩa từ bỏ mục tiêu xã hội chủ nghĩa.","Nhận diện khái niệm kinh tế thị trường định hướng xã hội chủ nghĩa, công nghiệp hóa – hiện đại hóa và hội nhập quốc tế."],"mcq":[{"q":"Tổng tuyển cử bầu Quốc hội chung của cả nước diễn ra ngày nào?","o":["30-04-1975","25-04-1976","02-07-1976","20-12-1976"],"a":1,"e":"Ngày 25-04-1976 diễn ra tổng tuyển cử; kỳ họp Quốc hội khóa VI sau đó quyết định các vấn đề thống nhất nhà nước."},{"q":"Tên nước Cộng hòa xã hội chủ nghĩa Việt Nam được quyết định tại sự kiện nào?","o":["Đại hội IV","Đại hội V","Kỳ họp thứ nhất Quốc hội khóa VI","Đại hội VI"],"a":2,"e":"Kỳ họp thứ nhất Quốc hội khóa VI tháng 06–07/1976 quyết định tên nước và các biểu tượng quốc gia."},{"q":"Đại hội IV của Đảng diễn ra vào thời gian nào?","o":["tháng 12/1976","tháng 03/1982","tháng 12/1986","tháng 06/1991"],"a":0,"e":"Đại hội IV diễn ra từ 14 đến 20-12-1976."},{"q":"Tại Đại hội IV, Đảng Lao động Việt Nam đổi tên thành gì?","o":["Đảng Cộng sản Đông Dương","Đảng Cộng sản Việt Nam","Đảng Lao động Đông Dương","Đảng Nhân dân Việt Nam"],"a":1,"e":"Đại hội IV quyết định đổi tên thành Đảng Cộng sản Việt Nam."},{"q":"Đại hội V diễn ra vào năm nào?","o":["1976","1980","1982","1986"],"a":2,"e":"Đại hội V diễn ra từ 27 đến 31-03-1982."},{"q":"Chỉ thị 100-CT/TW (13-01-1981) gắn với nội dung nào?","o":["Khoán sản phẩm trong nông nghiệp","Cương lĩnh 1991","Gia nhập ASEAN","Đổi tên nước"],"a":0,"e":"Chỉ thị 100 mở rộng khoán sản phẩm đến nhóm và người lao động trong hợp tác xã nông nghiệp."},{"q":"Đại hội nào khởi xướng đường lối đổi mới toàn diện?","o":["IV","V","VI","VII"],"a":2,"e":"Đại hội VI tháng 12/1986 là bước ngoặt khởi xướng đổi mới."},{"q":"Đại hội VI diễn ra vào thời gian nào?","o":["tháng 12/1976","tháng 03/1982","tháng 12/1986","tháng 06/1996"],"a":2,"e":"Đại hội VI họp từ 15 đến 18-12-1986."},{"q":"Cụm từ gắn với tinh thần đổi mới tại Đại hội VI là gì?","o":["Tập trung quan liêu, bao cấp","Nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật","Đóng cửa nền kinh tế","Chỉ phát triển công nghiệp nặng"],"a":1,"e":"Đây là cách diễn đạt nổi bật trong tổng kết thực tiễn và đổi mới tư duy."},{"q":"Đại hội VI xác định trọng tâm đổi mới trước hết là lĩnh vực nào?","o":["Tư duy, đặc biệt tư duy kinh tế","Chỉ văn hóa","Chỉ quốc phòng","Chỉ giáo dục"],"a":0,"e":"Đổi mới tư duy là tiền đề, trong đó đổi mới tư duy kinh tế giữ vai trò quan trọng."},{"q":"Đổi mới theo đường lối của Đảng có nghĩa là từ bỏ mục tiêu xã hội chủ nghĩa không?","o":["Có","Không","Chỉ trong nông nghiệp","Chỉ đến năm 1991"],"a":1,"e":"Đổi mới phương thức và cơ chế thực hiện, không phải từ bỏ mục tiêu đã xác định."},{"q":"Đại hội VII diễn ra vào năm nào?","o":["1986","1991","1996","2001"],"a":1,"e":"Đại hội VII diễn ra tháng 06/1991."},{"q":"Văn kiện quan trọng được thông qua tại Đại hội VII là gì?","o":["Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên CNXH","Hiệp định Genève","Chỉ thị 100-CT/TW","Hiến pháp 1946"],"a":0,"e":"Đại hội VII thông qua Cương lĩnh năm 1991."},{"q":"Đại hội VIII (1996) nhấn mạnh đưa đất nước vào thời kỳ nào?","o":["Kháng chiến chống Pháp","Đẩy mạnh công nghiệp hóa, hiện đại hóa","Tổng khởi nghĩa","Thống nhất nhà nước"],"a":1,"e":"Đây là dấu mốc thường được dùng để nhận diện Đại hội VIII."},{"q":"Đại hội IX diễn ra năm nào?","o":["1991","1996","2001","2006"],"a":2,"e":"Đại hội IX diễn ra tháng 04/2001."},{"q":"Đại hội IX xác định mô hình kinh tế tổng quát là gì?","o":["Kinh tế tự cung tự cấp","Kinh tế kế hoạch hóa tập trung thuần túy","Kinh tế thị trường định hướng xã hội chủ nghĩa","Kinh tế đóng cửa"],"a":2,"e":"Đại hội IX nêu mô hình kinh tế tổng quát là kinh tế thị trường định hướng xã hội chủ nghĩa."},{"q":"Đại hội XI diễn ra vào thời gian nào?","o":["tháng 01/2011","tháng 01/2016","tháng 04/2001","tháng 06/1996"],"a":0,"e":"Đại hội XI diễn ra tháng 01/2011."},{"q":"Cương lĩnh được bổ sung, phát triển năm 2011 gắn với Đại hội nào?","o":["VII","VIII","IX","XI"],"a":3,"e":"Đại hội XI thông qua Cương lĩnh bổ sung, phát triển năm 2011."},{"q":"Đại hội XII (2016) tổng kết chặng đường đổi mới bao nhiêu năm?","o":["10 năm","20 năm","30 năm","40 năm"],"a":2,"e":"Từ Đại hội VI năm 1986 đến Đại hội XII năm 2016 là 30 năm đổi mới."},{"q":"Nhận định nào phù hợp nhất về đường lối đổi mới?","o":["Chỉ đổi mới một ngành riêng lẻ","Đổi mới toàn diện, đồng bộ, phù hợp thực tiễn và quy luật khách quan","Từ bỏ mọi thành quả trước đó","Không cần tổng kết thực tiễn"],"a":1,"e":"Đổi mới được xác định là quá trình toàn diện, đồng bộ, có trọng tâm và dựa trên thực tiễn."}]}],"essay":[{"n":1,"q":"Phân tích bối cảnh lịch sử và yêu cầu khách quan dẫn đến sự ra đời của Đảng Cộng sản Việt Nam.","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Bối cảnh Việt Nam dưới ách thống trị thực dân; mâu thuẫn dân tộc và mâu thuẫn xã hội nổi bật.","Các phong trào yêu nước cuối thế kỷ XIX – đầu thế kỷ XX diễn ra mạnh mẽ nhưng lần lượt thất bại, đặt ra yêu cầu về đường lối và tổ chức lãnh đạo mới.","Ảnh hưởng của chủ nghĩa Mác – Lênin và phong trào cách mạng thế giới.","Vai trò chuẩn bị về tư tưởng, chính trị, tổ chức của Nguyễn Ái Quốc; sự phát triển của phong trào công nhân.","Kết luận: sự ra đời của Đảng đáp ứng yêu cầu lịch sử, kết hợp chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước Việt Nam."],"sample":"Sau khi hoàn thành xâm lược, thực dân Pháp biến Việt Nam thành xứ thuộc địa nửa phong kiến, trong xã hội nổi lên hai mâu thuẫn cơ bản: mâu thuẫn giữa toàn thể dân tộc Việt Nam với đế quốc xâm lược và tay sai, và mâu thuẫn giữa nông dân với địa chủ phong kiến, trong đó mâu thuẫn dân tộc là nổi bật nhất. Trước nhiệm vụ giải phóng dân tộc, nhiều phong trào yêu nước đã nổ ra, từ phong trào Cần Vương, khởi nghĩa Yên Thế đến các phong trào theo khuynh hướng dân chủ tư sản của Phan Bội Châu, Phan Châu Trinh và hoạt động của Việt Nam Quốc dân Đảng. Các phong trào ấy thể hiện tinh thần yêu nước mạnh mẽ nhưng lần lượt thất bại do hạn chế về lập trường giai cấp, đường lối và tổ chức, khiến cách mạng Việt Nam rơi vào khủng hoảng về đường lối và lực lượng lãnh đạo. Trong bối cảnh đó, Cách mạng Tháng Mười Nga năm 1917 và sự ra đời của Quốc tế Cộng sản năm 1919 mở ra thời đại mới; chủ nghĩa Mác – Lênin được Nguyễn Ái Quốc chuẩn bị về tư tưởng, chính trị, tổ chức rồi truyền bá vào Việt Nam, trong khi giai cấp công nhân ngày càng trưởng thành và phong trào công nhân phát triển mạnh. Như vậy, sự ra đời của Đảng là yêu cầu khách quan của lịch sử, là kết quả của sự kết hợp chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước Việt Nam."},{"n":2,"q":"Trình bày quá trình Nguyễn Ái Quốc tìm đường cứu nước và chuẩn bị các điều kiện thành lập Đảng.","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Ngày 05-06-1911, Nguyễn Tất Thành ra đi tìm đường cứu nước.","Quá trình khảo nghiệm thực tiễn, tiếp cận chủ nghĩa Mác – Lênin và xác định con đường giải phóng dân tộc theo cách mạng vô sản.","Năm 1920: tiếp cận Luận cương của Lênin về vấn đề dân tộc và thuộc địa; lựa chọn con đường cách mạng vô sản.","Chuẩn bị về tư tưởng, chính trị và tổ chức: truyền bá lý luận, đào tạo cán bộ, xây dựng tổ chức tiền thân.","Ý nghĩa: tạo nền tảng trực tiếp cho việc thành lập Đảng Cộng sản Việt Nam."],"sample":"Ngày 05-06-1911, người thanh niên Nguyễn Tất Thành rời bến Nhà Rồng ra đi tìm đường cứu nước. Người không đi theo con đường của các bậc tiền bối mà sang phương Tây để tìm hiểu và khảo nghiệm thực tiễn. Trong nhiều năm bôn ba qua nhiều châu lục, vừa lao động vừa hoạt động, Người nhận ra rằng ở đâu bọn đế quốc cũng tàn bạo và nhân dân lao động ở đâu cũng bị áp bức. Tháng 07-1920, khi đọc Luận cương của Lênin về vấn đề dân tộc và thuộc địa, Người tìm thấy con đường giải phóng dân tộc; tháng 12-1920, tại Đại hội Tours, Người bỏ phiếu tán thành Quốc tế Cộng sản và tham gia sáng lập Đảng Cộng sản Pháp, từ người yêu nước trở thành người cộng sản, xác định con đường cách mạng vô sản. Sau đó, Người chuẩn bị các điều kiện thành lập Đảng trên ba mặt. Về tư tưởng, chính trị, Người truyền bá chủ nghĩa Mác – Lênin về nước qua báo chí và các tác phẩm. Về tổ chức, năm 1925 Người thành lập Hội Việt Nam Cách mạng Thanh niên tại Quảng Châu, mở các lớp huấn luyện, đào tạo đội ngũ cán bộ cách mạng. Những hoạt động đó đã tạo nền tảng trực tiếp cho việc thành lập Đảng Cộng sản Việt Nam."},{"n":3,"q":"Trình bày hoàn cảnh, nội dung cơ bản và ý nghĩa của Hội nghị thành lập Đảng Cộng sản Việt Nam (đầu năm 1930).","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Bối cảnh xuất hiện các tổ chức cộng sản năm 1929 và yêu cầu thống nhất lực lượng.","Hội nghị do Nguyễn Ái Quốc chủ trì tại Cửu Long (Hương Cảng) vào đầu năm 1930.","Thống nhất các tổ chức cộng sản thành Đảng Cộng sản Việt Nam; thông qua các văn kiện cốt yếu, thường được gọi là Cương lĩnh chính trị đầu tiên.","Nêu những định hướng chính: độc lập dân tộc, vai trò lãnh đạo của Đảng, lực lượng cách mạng và quan hệ với cách mạng thế giới.","Ý nghĩa: chấm dứt khủng hoảng về đường lối và tổ chức lãnh đạo; mở ra bước ngoặt quan trọng của cách mạng Việt Nam."],"sample":"Năm 1929, ba tổ chức cộng sản lần lượt xuất hiện ở Việt Nam là Đông Dương Cộng sản Đảng, An Nam Cộng sản Đảng và Đông Dương Cộng sản Liên đoàn. Sự tồn tại của nhiều tổ chức hoạt động riêng rẽ, tranh giành ảnh hưởng của nhau, đặt ra yêu cầu cấp bách phải thống nhất thành một đảng duy nhất. Với tư cách là đại diện Quốc tế Cộng sản, Nguyễn Ái Quốc triệu tập và chủ trì Hội nghị hợp nhất tại Cửu Long (Hương Cảng, Trung Quốc), diễn ra từ ngày 06-01-1930 đến ngày 07-02-1930; ngày 03-02-1930 được lấy làm ngày kỷ niệm thành lập Đảng. Hội nghị nhất trí hợp nhất các tổ chức cộng sản thành một đảng duy nhất là Đảng Cộng sản Việt Nam và thông qua các văn kiện do Nguyễn Ái Quốc soạn thảo (Chánh cương vắn tắt, Sách lược vắn tắt, Chương trình tóm tắt, Điều lệ vắn tắt), hợp thành Cương lĩnh chính trị đầu tiên của Đảng. Cương lĩnh xác định đường lối làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới xã hội cộng sản; nhiệm vụ là đánh đổ đế quốc và phong kiến, giành độc lập dân tộc; Đảng là đội tiên phong của giai cấp vô sản, tập hợp công nhân, nông dân làm gốc và liên minh với các tầng lớp yêu nước; cách mạng Việt Nam là một bộ phận của cách mạng thế giới. Việc thành lập Đảng chấm dứt cuộc khủng hoảng về đường lối và tổ chức lãnh đạo, mở ra bước ngoặt vĩ đại trong lịch sử cách mạng Việt Nam."},{"n":4,"q":"So sánh Cương lĩnh chính trị đầu tiên (1930) với Luận cương chính trị tháng 10/1930.","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"Đây là câu so sánh dễ cần thuật ngữ chính xác; hãy đối chiếu đúng bảng/đoạn so sánh trong giáo trình.","out":["Điểm giống: đều xác định vai trò lãnh đạo của Đảng, phương hướng cách mạng và liên hệ với cách mạng thế giới.","Điểm khác: làm rõ cách xác định nhiệm vụ dân tộc và giai cấp, lực lượng cách mạng, cách nhìn nhận vai trò của các tầng lớp xã hội.","Đánh giá ưu điểm của Cương lĩnh đầu tiên trong việc đặt vấn đề giải phóng dân tộc nổi bật, phù hợp hoàn cảnh thuộc địa.","Trình bày hạn chế của Luận cương theo cách diễn đạt trong giáo trình, nhất là việc chưa đánh giá đầy đủ vai trò và khả năng cách mạng của một số tầng lớp.","Kết luận: nêu ý nghĩa của việc vận dụng sáng tạo lý luận vào điều kiện Việt Nam."],"sample":"Cương lĩnh chính trị đầu tiên (02-1930) và Luận cương chính trị (10-1930) có những điểm chung cơ bản: đều xác định cách mạng Việt Nam trải qua hai giai đoạn là cách mạng tư sản dân quyền rồi tiến lên chủ nghĩa xã hội, đều khẳng định vai trò lãnh đạo của Đảng Cộng sản, chủ trương dùng bạo lực cách mạng và coi cách mạng Việt Nam là một bộ phận của cách mạng thế giới. Tuy nhiên hai văn kiện khác nhau ở cách xác định nhiệm vụ và lực lượng cách mạng. Cương lĩnh của Nguyễn Ái Quốc nhận rõ mâu thuẫn chủ yếu của xã hội thuộc địa nên đặt nhiệm vụ chống đế quốc, giành độc lập dân tộc lên hàng đầu, chủ trương tập hợp rộng rãi các tầng lớp yêu nước và với tư sản dân tộc chưa rõ mặt phản cách mạng thì tìm cách lợi dụng hoặc làm cho họ đứng trung lập. Luận cương do Trần Phú khởi thảo và được thông qua tại Hội nghị Trung ương tháng 10-1930 lại nặng về đấu tranh giai cấp, đặt vấn đề dân tộc ngang hàng với vấn đề ruộng đất, lực lượng chủ yếu chỉ là công nhân và nông dân, chưa đánh giá đúng khả năng cách mạng của tiểu tư sản, tư sản dân tộc và các tầng lớp khác. Có thể đánh giá Cương lĩnh đầu tiên là sự vận dụng sáng tạo chủ nghĩa Mác – Lênin vào hoàn cảnh một nước thuộc địa nửa phong kiến, còn hạn chế của Luận cương về sau được Đảng khắc phục từng bước qua các hội nghị Trung ương từ năm 1939."},{"n":5,"q":"Trình bày chủ trương và ý nghĩa của phong trào cách mạng 1930–1931, đỉnh cao là Xô viết Nghệ – Tĩnh.","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Nguyên nhân và bối cảnh khủng hoảng kinh tế, áp bức thuộc địa và sự lãnh đạo của Đảng mới thành lập.","Diễn biến khái quát của phong trào đấu tranh công nhân, nông dân; sự phát triển mạnh tại Nghệ An và Hà Tĩnh.","Những hình thức chính quyền cách mạng ở một số địa phương và nội dung thực hiện.","Ý nghĩa: khẳng định năng lực lãnh đạo của Đảng, sức mạnh công – nông và để lại kinh nghiệm cho các giai đoạn sau.","Hạn chế/tổn thất do sự đàn áp và bài học về tổ chức, lực lượng, phương pháp đấu tranh."],"sample":"Phong trào cách mạng 1930–1931 nổ ra trong bối cảnh cuộc khủng hoảng kinh tế thế giới tác động nặng nề đến Việt Nam, đời sống công nhân, nông dân cùng cực, cộng với chính sách khủng bố của thực dân Pháp sau khởi nghĩa Yên Bái, trong khi Đảng Cộng sản Việt Nam vừa ra đời đã kịp thời lãnh đạo quần chúng đấu tranh. Phong trào bắt đầu bằng các cuộc đấu tranh của công nhân và nông dân ở nhiều nơi, mạnh lên từ ngày 01-05-1930 và từ tháng 09-1930 phát triển thành cao trào, đỉnh cao là ở Nghệ An và Hà Tĩnh với những cuộc biểu tình lớn của nông dân. Ở nhiều xã, chính quyền thực dân và phong kiến tan rã, các Xô viết ra đời, thực hiện quyền làm chủ của nhân dân: chia ruộng đất công, giảm tô, xóa nợ, bỏ thuế, xây dựng lực lượng tự vệ, bài trừ các tệ nạn xã hội. Thực dân Pháp đàn áp rất dã man nên đến năm 1931 phong trào tạm lắng, lực lượng cách mạng bị tổn thất nặng. Dù vậy, phong trào khẳng định đường lối đúng đắn và năng lực lãnh đạo của Đảng, sức mạnh của khối liên minh công – nông, được coi là cuộc tập dượt đầu tiên cho Cách mạng Tháng Tám và để lại bài học quý về xây dựng lực lượng, mặt trận và phương pháp đấu tranh."},{"n":6,"q":"Phân tích sự chuyển hướng chỉ đạo chiến lược của Đảng giai đoạn 1939–1945 và vai trò của Hội nghị Trung ương 8 (10-05-1941 – 19-05-1941).","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Chiến tranh thế giới thứ hai bùng nổ, tình hình Đông Dương thay đổi; nhiệm vụ giải phóng dân tộc trở nên cấp bách.","Các hội nghị Trung ương từ 1939 từng bước điều chỉnh nhiệm vụ và hình thức đấu tranh.","Hội nghị Trung ương 8 (10-05-1941 – 19-05-1941) do Nguyễn Ái Quốc chủ trì: đặt giải phóng dân tộc lên hàng đầu, thành lập Mặt trận Việt Minh và chuẩn bị khởi nghĩa.","Xây dựng lực lượng chính trị, lực lượng vũ trang, căn cứ địa và chuẩn bị thời cơ.","Ý nghĩa: hoàn chỉnh sự chuyển hướng chiến lược, chuẩn bị trực tiếp cho thắng lợi Cách mạng Tháng Tám."],"sample":"Năm 1939, Chiến tranh thế giới thứ hai bùng nổ; từ năm 1940 Nhật vào Đông Dương, Pháp – Nhật cùng thống trị, nhân dân ta chịu hai tầng áp bức, mâu thuẫn dân tộc trở nên gay gắt, nhiệm vụ giải phóng dân tộc trở thành yêu cầu cấp bách nhất. Trong bối cảnh đó, Đảng từng bước chuyển hướng chỉ đạo chiến lược. Hội nghị Trung ương 6 (11-1939) đặt nhiệm vụ giải phóng dân tộc lên hàng đầu, tạm gác khẩu hiệu cách mạng ruộng đất, chủ trương lập Mặt trận Thống nhất dân tộc phản đế Đông Dương; Hội nghị Trung ương 7 (11-1940) tiếp tục chủ trương đó. Bước chuyển hướng được hoàn chỉnh tại Hội nghị Trung ương 8 (10-05-1941 – 19-05-1941) do Nguyễn Ái Quốc chủ trì: Hội nghị khẳng định nhiệm vụ chủ yếu trước mắt là giải phóng dân tộc, quyết định thành lập Mặt trận Việt Minh, xác định chuẩn bị khởi nghĩa vũ trang là nhiệm vụ trung tâm, xây dựng lực lượng chính trị, lực lượng vũ trang và căn cứ địa cách mạng. Nhờ sự chuyển hướng đúng đắn và sự chuẩn bị lâu dài ấy, khi thời cơ đến Đảng đã lãnh đạo nhân dân giành thắng lợi trong Cách mạng Tháng Tám năm 1945."},{"n":7,"q":"Trình bày nguyên nhân thắng lợi, ý nghĩa lịch sử và bài học kinh nghiệm của Cách mạng Tháng Tám năm 1945.","part":"PHẦN I. CHƯƠNG 1 – ĐẢNG RA ĐỜI VÀ ĐẤU TRANH GIÀNH CHÍNH QUYỀN","pri":"Ưu tiên cao","note":"","out":["Thời cơ xuất hiện khi Nhật đầu hàng Đồng minh; sự lãnh đạo và chuẩn bị lâu dài của Đảng.","Phát huy sức mạnh đại đoàn kết toàn dân, kết hợp lực lượng chính trị với lực lượng vũ trang và chớp thời cơ.","Ý nghĩa trong nước: lật đổ chế độ thuộc địa, phong kiến; lập nước Việt Nam Dân chủ Cộng hòa; nhân dân trở thành người làm chủ.","Ý nghĩa quốc tế: cổ vũ phong trào giải phóng dân tộc.","Bài học: đặt nhiệm vụ dân tộc đúng lúc, chuẩn bị lực lượng, xây dựng khối đoàn kết và quyết đoán khi thời cơ đến."],"sample":"Cách mạng Tháng Tám năm 1945 thắng lợi nhờ những nguyên nhân chủ yếu sau. Về khách quan, Nhật đầu hàng Đồng minh tháng 08-1945 làm quân Nhật ở Đông Dương hoang mang, tạo thời cơ cách mạng chín muồi. Về chủ quan, nhân dân ta có truyền thống yêu nước, Đảng có đường lối đúng đắn và đã chuẩn bị lâu dài về lực lượng chính trị, lực lượng vũ trang, căn cứ địa, đặc biệt là Mặt trận Việt Minh, đồng thời biết chớp thời cơ, phát động Tổng khởi nghĩa khi thời cơ đến (Hà Nội 19-08, Huế 23-08, Sài Gòn 25-08). Cách mạng Tháng Tám có ý nghĩa to lớn: trong nước, nó lật đổ chế độ thực dân và phong kiến, lập nên nước Việt Nam Dân chủ Cộng hòa, đưa nhân dân từ thân phận nô lệ lên địa vị người làm chủ, Đảng trở thành đảng cầm quyền; trên thế giới, nó cổ vũ phong trào giải phóng dân tộc ở các nước thuộc địa. Từ đó rút ra các bài học: giương cao ngọn cờ độc lập dân tộc, huy động sức mạnh đại đoàn kết toàn dân, kết hợp lực lượng chính trị với lực lượng vũ trang, chuẩn bị lực lượng chu đáo và quyết đoán nắm thời cơ khi nó xuất hiện."},{"n":8,"q":"Phân tích tình thế “ngàn cân treo sợi tóc” của nước Việt Nam Dân chủ Cộng hòa sau Cách mạng Tháng Tám và chủ trương của Đảng.","part":"PHẦN II. CHƯƠNG 2 – XÂY DỰNG CHÍNH QUYỀN VÀ KHÁNG CHIẾN CHỐNG PHÁP (1945–1954)","pri":"Ưu tiên cao","note":"","out":["Thuận lợi: chính quyền cách mạng được thành lập, nhân dân có tinh thần độc lập, Đảng và Chủ tịch Hồ Chí Minh có uy tín.","Khó khăn: nạn đói, nạn dốt, tài chính kiệt quệ; quân đội nước ngoài vào giải giáp Nhật; thực dân Pháp quay lại xâm lược; các lực lượng chống phá.","Chủ trương: củng cố chính quyền, chống giặc đói, giặc dốt và giặc ngoại xâm; tranh thủ hòa hoãn, phân hóa đối phương và chuẩn bị lực lượng.","Biện pháp và sự kiện tiêu biểu: Tổng tuyển cử 06-01-1946, xây dựng bộ máy nhà nước, Hiệp định Sơ bộ 06-03-1946, Tạm ước 14-09-1946.","Đánh giá hiệu quả: giữ vững chính quyền non trẻ và tạo thêm thời gian chuẩn bị kháng chiến."],"sample":"Sau Cách mạng Tháng Tám, nước Việt Nam Dân chủ Cộng hòa non trẻ ở vào tình thế “ngàn cân treo sợi tóc”. Thuận lợi là chính quyền cách mạng đã được thành lập, nhân dân phấn khởi giữ vững độc lập, Đảng và Chủ tịch Hồ Chí Minh có uy tín lớn. Nhưng khó khăn rất nhiều: nạn đói và nạn dốt hoành hành, ngân khố trống rỗng; quân đội nước ngoài vào giải giáp quân Nhật, phía Bắc là quân Tưởng, phía Nam là quân Anh tạo điều kiện cho Pháp quay lại xâm lược; các thế lực phản động trong nước ra sức chống phá. Trước tình hình đó, Đảng đề ra chủ trương củng cố chính quyền, chống giặc đói, giặc dốt và giặc ngoại xâm, xác định kẻ thù chính là thực dân Pháp, thực hiện sách lược hòa hoãn, phân hóa kẻ thù để tranh thủ thời gian chuẩn bị lực lượng. Các biện pháp tiêu biểu gồm Tổng tuyển cử ngày 06-01-1946 bầu Quốc hội đầu tiên, xây dựng bộ máy nhà nước và ban hành Hiến pháp, phát động phong trào tăng gia sản xuất và xóa nạn mù chữ, ký Hiệp định Sơ bộ ngày 06-03-1946 và Tạm ước ngày 14-09-1946. Nhờ vậy ta giữ vững chính quyền cách mạng non trẻ và có thêm thời gian chuẩn bị cho cuộc kháng chiến lâu dài."},{"n":9,"q":"Trình bày đường lối kháng chiến chống thực dân Pháp của Đảng và phân tích tính đúng đắn của đường lối đó.","part":"PHẦN II. CHƯƠNG 2 – XÂY DỰNG CHÍNH QUYỀN VÀ KHÁNG CHIẾN CHỐNG PHÁP (1945–1954)","pri":"Ưu tiên cao","note":"","out":["Nêu bối cảnh Pháp mở rộng chiến tranh, đỉnh điểm là lời kêu gọi Toàn quốc kháng chiến tháng 12/1946.","Các văn kiện thể hiện đường lối: Chỉ thị Toàn dân kháng chiến (12-12-1946), Lời kêu gọi Toàn quốc kháng chiến (19-12-1946), tác phẩm Kháng chiến nhất định thắng lợi (1947).","Đường lối: toàn dân, toàn diện, trường kỳ, dựa vào sức mình là chính.","Giải thích từng nội dung: huy động toàn dân; đấu tranh trên nhiều mặt; khắc phục tương quan lực lượng bằng chiến tranh lâu dài; phát huy nội lực đồng thời tranh thủ sự ủng hộ quốc tế.","Ý nghĩa: định hướng tổ chức và phát triển cuộc kháng chiến đến thắng lợi."],"sample":"Khi thực dân Pháp mở rộng chiến tranh xâm lược và tìm cách phá vỡ các thỏa thuận, Đảng quyết định phát động toàn quốc kháng chiến vào tháng 12-1946. Đường lối kháng chiến được thể hiện trong Chỉ thị Toàn dân kháng chiến (12-12-1946), Lời kêu gọi Toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh (19-12-1946) và tác phẩm Kháng chiến nhất định thắng lợi của Trường Chinh (1947). Nội dung cốt lõi là kháng chiến toàn dân, toàn diện, trường kỳ, dựa vào sức mình là chính. Toàn dân nghĩa là mọi người dân, không phân biệt tuổi tác, giới tính, tôn giáo, đều tham gia kháng chiến. Toàn diện nghĩa là đánh địch trên mọi mặt: quân sự, chính trị, kinh tế, văn hóa, ngoại giao. Trường kỳ nghĩa là đánh lâu dài để từng bước chuyển hóa tương quan lực lượng vì lúc đầu ta yếu hơn địch về vật chất. Dựa vào sức mình là chính là phát huy nội lực của dân tộc, đồng thời tranh thủ sự ủng hộ của quốc tế. Đường lối đó đúng đắn vì xuất phát từ tương quan lực lượng và truyền thống đánh giặc giữ nước của dân tộc, phát huy được sức mạnh của chiến tranh nhân dân, và đã được thực tiễn kiểm nghiệm qua thắng lợi của cuộc kháng chiến, định hướng việc tổ chức và phát triển cuộc kháng chiến đến thắng lợi."},{"n":10,"q":"Phân tích thắng lợi Việt Bắc Thu – Đông 1947 và Chiến dịch Biên giới Thu – Đông 1950.","part":"PHẦN II. CHƯƠNG 2 – XÂY DỰNG CHÍNH QUYỀN VÀ KHÁNG CHIẾN CHỐNG PHÁP (1945–1954)","pri":"Ưu tiên cao","note":"","out":["Việt Bắc 1947: Pháp tiến công lên căn cứ địa nhằm tiêu diệt cơ quan đầu não và bộ đội chủ lực; quân dân ta đánh bại cuộc tiến công.","Ý nghĩa Việt Bắc: bảo vệ cơ quan đầu não, làm thất bại chiến lược “đánh nhanh thắng nhanh”, đưa kháng chiến phát triển.","Biên giới 1950: chủ động mở chiến dịch nhằm tiêu diệt sinh lực địch, khai thông biên giới và mở rộng căn cứ địa.","Kết quả và ý nghĩa Biên giới: giành thế chủ động chiến lược trên chiến trường chính Bắc Bộ, tăng cường liên lạc quốc tế.","So sánh: Việt Bắc là thắng lợi phản công làm thất bại cuộc tiến công lớn; Biên giới là chiến dịch chủ động tiến công có ý nghĩa chuyển biến thế chiến lược."],"sample":"Chiến dịch Việt Bắc Thu – Đông 1947 (từ 07-10-1947 đến 19-12-1947) diễn ra khi Pháp huy động lực lượng tiến công lên căn cứ địa Việt Bắc nhằm tiêu diệt cơ quan đầu não kháng chiến và bộ đội chủ lực của ta, kết thúc nhanh chiến tranh. Quân dân ta chủ động đánh trả và đã đánh bại cuộc tiến công này, bảo vệ vững chắc cơ quan đầu não, làm thất bại chiến lược “đánh nhanh thắng nhanh” của Pháp, buộc chúng phải chuyển sang đánh lâu dài, qua đó đưa kháng chiến bước sang giai đoạn phát triển mới. Chiến dịch Biên giới Thu – Đông 1950 (từ 16-09-1950 đến 14-10-1950) là chiến dịch do ta chủ động mở nhằm tiêu diệt sinh lực địch, khai thông biên giới Việt – Trung và mở rộng căn cứ địa. Thắng lợi của chiến dịch giúp ta giành quyền chủ động trên chiến trường chính Bắc Bộ, phá thế bao vây của địch và tăng cường liên lạc với các nước xã hội chủ nghĩa. So sánh hai chiến dịch, Việt Bắc 1947 là thắng lợi của cuộc phản công, đánh bại một cuộc tiến công lớn của địch, còn Biên giới 1950 là chiến dịch tiến công chủ động có ý nghĩa chuyển biến thế chiến lược theo hướng có lợi cho ta."},{"n":11,"q":"Trình bày diễn biến khái quát, kết quả và ý nghĩa lịch sử của chiến thắng Điện Biên Phủ năm 1954.","part":"PHẦN II. CHƯƠNG 2 – XÂY DỰNG CHÍNH QUYỀN VÀ KHÁNG CHIẾN CHỐNG PHÁP (1945–1954)","pri":"Ưu tiên cao","note":"","out":["Bối cảnh kế hoạch Nava và việc Pháp xây dựng Điện Biên Phủ thành tập đoàn cứ điểm.","Chủ trương của ta mở chiến dịch chiến lược; chuẩn bị lực lượng, hậu cần và phương châm tác chiến.","Chiến dịch diễn ra từ 13-03-1954 đến 07-05-1954, gồm ba đợt tiến công lớn.","Kết quả: tập đoàn cứ điểm bị tiêu diệt, tạo điều kiện quyết định cho việc ký Hiệp định Genève.","Ý nghĩa: đỉnh cao của cuộc kháng chiến chống Pháp, cổ vũ phong trào giải phóng dân tộc và nâng cao vị thế Việt Nam."],"sample":"Từ năm 1953, thực dân Pháp thực hiện kế hoạch Nava nhằm tạo chuyển biến chiến lược trên chiến trường, trong đó xây dựng Điện Biên Phủ thành một tập đoàn cứ điểm mạnh ở Tây Bắc. Trước tình hình đó, Bộ Chính trị quyết định mở chiến dịch Điện Biên Phủ nhằm tiêu diệt tập đoàn cứ điểm này, ta chuẩn bị lực lượng, hậu cần rất công phu và chọn phương châm tác chiến phù hợp với tình hình thực tế. Chiến dịch diễn ra từ ngày 13-03-1954 đến ngày 07-05-1954, gồm ba đợt tiến công lớn, kết thúc bằng việc toàn bộ tập đoàn cứ điểm bị tiêu diệt và bắt sống tướng chỉ huy. Chiến thắng Điện Biên Phủ đã tạo điều kiện quyết định cho việc ký Hiệp định Genève ngày 21-07-1954, chấm dứt chiến tranh xâm lược của thực dân Pháp, lập lại hòa bình ở Đông Dương. Về ý nghĩa, đây là đỉnh cao của cuộc kháng chiến chống thực dân Pháp, đánh dấu sự phá sản của chủ nghĩa thực dân cũ, cổ vũ mạnh mẽ phong trào giải phóng dân tộc trên thế giới và nâng cao vị thế của Việt Nam."},{"n":12,"q":"Phân tích nguyên nhân thắng lợi và bài học kinh nghiệm của cuộc kháng chiến chống thực dân Pháp (1945–1954).","part":"PHẦN II. CHƯƠNG 2 – XÂY DỰNG CHÍNH QUYỀN VÀ KHÁNG CHIẾN CHỐNG PHÁP (1945–1954)","pri":"Ưu tiên cao","note":"","out":["Sự lãnh đạo đúng đắn của Đảng với đường lối kháng chiến phù hợp.","Tinh thần yêu nước, đoàn kết và hy sinh của nhân dân; xây dựng lực lượng vũ trang và hậu phương.","Đường lối chiến tranh nhân dân, toàn dân, toàn diện, trường kỳ, tự lực cánh sinh.","Sự phối hợp và ủng hộ quốc tế, đặc biệt mối liên hệ với cách mạng Lào và Campuchia.","Bài học về đoàn kết, phát huy nội lực, kết hợp quân sự – chính trị – ngoại giao và tổ chức chiến tranh nhân dân."],"sample":"Cuộc kháng chiến chống thực dân Pháp (1945–1954) thắng lợi nhờ nhiều nguyên nhân. Trước hết là sự lãnh đạo đúng đắn của Đảng với đường lối kháng chiến toàn dân, toàn diện, trường kỳ, tự lực cánh sinh phù hợp với tương quan lực lượng, kết hợp chiến đấu quân sự với chính trị, kinh tế, văn hóa, ngoại giao. Đó còn là tinh thần yêu nước, đoàn kết và hy sinh của toàn dân, sự trưởng thành của lực lượng vũ trang ba thứ quân và hậu phương vững chắc, là chiến tranh nhân dân được phát huy cao độ. Bên cạnh đó là sự đoàn kết, phối hợp chiến đấu của nhân dân ba nước Việt Nam, Lào, Campuchia và sự ủng hộ của các lực lượng tiến bộ trên thế giới. Từ thắng lợi đó có thể rút ra các bài học: giữ vững sự lãnh đạo của Đảng và đoàn kết toàn dân, phát huy nội lực đồng thời tranh thủ sự ủng hộ quốc tế, kết hợp chặt chẽ đấu tranh quân sự, chính trị, ngoại giao, và xây dựng, tổ chức chiến tranh nhân dân phù hợp với từng giai đoạn."},{"n":13,"q":"Trình bày quá trình thống nhất đất nước về mặt nhà nước sau năm 1975 và ý nghĩa.","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên cao","note":"","out":["Tổng tuyển cử ngày 25-04-1976 bầu Quốc hội chung của cả nước.","Kỳ họp thứ nhất Quốc hội khóa VI từ 24-06-1976 đến 03-07-1976 quyết định tên nước Cộng hòa xã hội chủ nghĩa Việt Nam và các vấn đề nhà nước thống nhất.","Ý nghĩa: hoàn thành thống nhất về mặt nhà nước, tạo cơ sở pháp lý và chính trị để cả nước cùng xây dựng và bảo vệ Tổ quốc."],"sample":"Sau đại thắng mùa Xuân năm 1975, đất nước đã hoàn toàn độc lập nhưng còn tình trạng hai miền với hai chế độ chính quyền khác nhau, đặt ra yêu cầu thống nhất đất nước về mặt nhà nước. Sau Hội nghị hiệp thương chính trị cuối năm 1975, ngày 25-04-1976 cử tri cả nước đi bầu Quốc hội chung của nước Việt Nam thống nhất, trong cuộc Tổng tuyển cử đầu tiên trong cả nước. Kỳ họp thứ nhất Quốc hội khóa VI (từ 24-06-1976 đến 03-07-1976) quyết định tên nước là Cộng hòa xã hội chủ nghĩa Việt Nam, xác định Quốc kỳ, Quốc ca, Thủ đô là Hà Nội, đổi tên thành phố Sài Gòn – Gia Định thành thành phố Hồ Chí Minh và bầu ra các cơ quan lãnh đạo nhà nước. Việc thống nhất đất nước về mặt nhà nước có ý nghĩa hoàn thành thống nhất về nhà nước, tạo cơ sở pháp lý và chính trị để cả nước cùng đi lên chủ nghĩa xã hội, cùng xây dựng và bảo vệ Tổ quốc, đồng thời thể hiện nguyện vọng thiêng liêng của nhân dân cả nước."},{"n":14,"q":"Phân tích bối cảnh, nội dung cơ bản và ý nghĩa của đường lối đổi mới tại Đại hội VI (15-12-1986 – 18-12-1986).","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên cao","note":"","out":["Bối cảnh: khó khăn kinh tế – xã hội, hạn chế của cơ chế tập trung quan liêu, bao cấp và yêu cầu phải thay đổi cách quản lý.","Tinh thần: nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật; tôn trọng quy luật khách quan.","Đổi mới toàn diện, đồng bộ, có trọng tâm; trước hết đổi mới tư duy, đặc biệt tư duy kinh tế.","Từng bước chuyển đổi cơ chế quản lý kinh tế, phát huy động lực sản xuất và thừa nhận nền kinh tế nhiều thành phần trong thời kỳ quá độ.","Ý nghĩa: mở ra thời kỳ đổi mới; không phải từ bỏ mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội."],"sample":"Đến giữa những năm 1980, đất nước lâm vào khủng hoảng kinh tế – xã hội trầm trọng: sản xuất đình trệ, lạm phát cao, đời sống nhân dân khó khăn, trong khi cơ chế tập trung quan liêu, bao cấp bộc lộ rõ hạn chế và đòi hỏi phải thay đổi cách quản lý. Trên cơ sở tổng kết thực tiễn, Đại hội VI của Đảng (15-12-1986 – 18-12-1986) quyết định đường lối đổi mới. Đại hội nêu tinh thần nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật, tôn trọng quy luật khách quan; chủ trương đổi mới toàn diện, đồng bộ, có trọng tâm, trước hết là đổi mới tư duy, đặc biệt là tư duy kinh tế. Về kinh tế, Đại hội chủ trương từng bước chuyển đổi cơ chế quản lý, phát huy động lực sản xuất và thừa nhận nền kinh tế nhiều thành phần trong thời kỳ quá độ. Đại hội VI có ý nghĩa mở ra thời kỳ đổi mới của đất nước; cần nhấn mạnh đổi mới không phải là từ bỏ mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội mà là tìm cách thực hiện mục tiêu đó hiệu quả hơn."},{"n":15,"q":"Trình bày quá trình phát triển đường lối đổi mới qua các Đại hội VII, VIII, IX, XI và XII.","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên cao","note":"","out":["Đại hội VII (1991): thông qua Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội.","Đại hội VIII (1996): xác định chuyển sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa.","Đại hội IX (2001): xác định mô hình kinh tế tổng quát là kinh tế thị trường định hướng xã hội chủ nghĩa.","Đại hội XI (2011): thông qua Cương lĩnh bổ sung, phát triển năm 2011 và Chiến lược phát triển kinh tế – xã hội 2011–2020.","Đại hội XII (2016): tổng kết 30 năm đổi mới; tiếp tục nhấn mạnh đổi mới toàn diện, đồng bộ và phát triển bền vững."],"sample":"Đường lối đổi mới được bổ sung, phát triển qua các kỳ đại hội. Đại hội VII (1991) thông qua Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội, tạo cơ sở để tiếp tục đổi mới. Đại hội VIII (1996) đánh giá đất nước ra khỏi khủng hoảng kinh tế – xã hội và xác định chuyển sang thời kỳ đẩy mạnh công nghiệp hóa, hiện đại hóa. Đại hội IX (2001) xác định mô hình kinh tế tổng quát của thời kỳ quá độ là kinh tế thị trường định hướng xã hội chủ nghĩa. Đại hội XI (2011) thông qua Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) và Chiến lược phát triển kinh tế – xã hội 2011–2020. Đại hội XII (2016) tổng kết 30 năm đổi mới và tiếp tục nhấn mạnh đổi mới toàn diện, đồng bộ, phát triển nhanh gắn với bền vững. Có thể thấy quá trình này đi từ khởi xướng đường lối, hình thành cương lĩnh, xác định nhiệm vụ trọng tâm, xác lập mô hình kinh tế cho đến tổng kết, hoàn thiện, cho thấy nhận thức của Đảng ngày càng sâu sắc và đầy đủ hơn."},{"n":16,"q":"Phân tích những thành tựu, hạn chế và bài học kinh nghiệm sau 30 năm đổi mới (1986–2016).","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên cao","note":"","out":["Thành tựu: phát triển kinh tế, cải thiện đời sống, phát triển văn hóa – xã hội, mở rộng quan hệ đối ngoại và hội nhập quốc tế.","Hạn chế: chất lượng và tính bền vững của tăng trưởng, năng suất và hiệu quả, một số vấn đề xã hội và quản lý vẫn cần khắc phục.","Bài học: kiên định mục tiêu; đổi mới sáng tạo trên cơ sở thực tiễn; lấy nhân dân làm gốc; kết hợp sức mạnh dân tộc với sức mạnh thời đại; xây dựng Đảng trong sạch, vững mạnh.","Đánh giá đổi mới là quá trình lâu dài, cần tiếp tục hoàn thiện thể chế và tổ chức thực hiện."],"sample":"Sau 30 năm đổi mới (1986–2016), đất nước đạt những thành tựu to lớn: thoát khỏi khủng hoảng kinh tế – xã hội, kinh tế tăng trưởng khá, đời sống nhân dân được cải thiện rõ rệt, văn hóa – xã hội có nhiều tiến bộ, quan hệ đối ngoại được mở rộng và hội nhập quốc tế ngày càng sâu rộng, vị thế quốc tế của Việt Nam được nâng cao. Tuy nhiên, vẫn còn những hạn chế: chất lượng tăng trưởng và sức cạnh tranh chưa cao, năng suất và hiệu quả còn thấp, một số vấn đề xã hội và quản lý chậm được khắc phục, thể chế còn cần hoàn thiện. Từ thực tiễn đó có thể rút ra các bài học: kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội; đổi mới sáng tạo trên cơ sở thực tiễn và tôn trọng quy luật khách quan; lấy nhân dân làm gốc; kết hợp sức mạnh dân tộc với sức mạnh thời đại; và không ngừng xây dựng Đảng trong sạch, vững mạnh. Đổi mới là quá trình lâu dài, đòi hỏi tiếp tục hoàn thiện thể chế và tổ chức thực hiện hiệu quả."},{"n":17,"q":"Phân tích mô hình kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam và ý nghĩa của việc xác định mô hình này.","part":"PHẦN III. CHƯƠNG 3 – XÂY DỰNG ĐẤT NƯỚC VÀ CÔNG CUỘC ĐỔI MỚI (1975–2018)","pri":"Ưu tiên khá cao","note":"","out":["Gắn với Đại hội IX (2001), xác định đây là mô hình kinh tế tổng quát trong thời kỳ quá độ.","Vận hành theo quy luật thị trường, có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa và sự lãnh đạo của Đảng.","Gắn phát triển kinh tế với mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","Kết hợp tăng trưởng với t
